title: 예린님의 학습 노트
locale: "ko-KR"            # <html lang="ko">, 테마 문구 한글화 (목차, 댓글 등)
date_format: "%Y.%m.%d"    # 날짜 표기
remote_theme: "mmistakes/minimal-mistakes"
url: "https://paaaraaaeaaa.github.io"
baseurl: "/my-blog"
plugins:
  - jekyll-include-cache
  - jekyll-sitemap   # /sitemap.xml — 검색엔진이 새 글을 찾는 지도
  - jekyll-feed      # /feed.xml — RSS 구독

# 🔗 링크 공유(카카오톡/문자/디스코드 등) 시 미리보기에 쓰일 설명 + 이미지
# description: 미리보기 카드에 나올 한 줄 소개
# og_image: 미리보기 카드의 대표 이미지 (og:image / twitter:image). 이걸 지정 안 하면
#        일부 메신저 앱이 페이지에서 처음 보이는 이미지(=프로필 사진)를 멋대로 가져다 씀.
# 주의: minimal-mistakes 테마는 이 값을 "image"가 아니라 "og_image" 키로 읽는다
#      (테마 자체 _includes/seo.html 기준 — jekyll-seo-tag 플러그인의 "image"와는 다름).
#      "logo"도 절대 쓰면 안 됨 — 테마가 그걸 상단 네비게이션 바의 작은 로고 이미지로
#      실제로 렌더링해버려서, 큰 배너 이미지가 찌그러져 박히는 문제가 생김.
description: "데이터 분석과 클라우드 아키텍처를 공부하며 매일 배운 내용을 기록하는 학습 블로그입니다."
og_image: "/assets/images/og-banner.png"

# 🎨 테마 스킨: dark 고정. 실제 색은 assets/css/tokens.css가 덮어쓴다 (DESIGN.md 참고)
minimal_mistakes_skin: "dark"

# 미래 날짜로 작성해도 바로 게시되도록 허용
future: true

# GitHub Pages 빌드 서버는 기본적으로 UTC를 쓴다. 이걸 안 맞추면 한국 시간 새벽(00~09시)에
# 빌드될 때 "오늘 날짜"가 하루 전으로 계산돼서, index.md의 N일차 계산이 어긋난다.
timezone: "Asia/Seoul"

# 🔍 사이트 전체 검색 기능 (상단 돋보기 아이콘)
search: true
search_full_content: true

# 👤 좌측 프로필 설정
author:
  name: "김예린"
  bio: "데이터 분석과 클라우드 아키텍처에 관심이 많은 대학생입니다."
  avatar: "/assets/images/profile.webp"   # 256px WebP (원본 profile.png는 og 등 다른 용도로 보관)
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/paaaraaaeaaa"

# 💬 댓글 기능 켜기 (GitHub 계정 연동)
repository: "paaaraaaeaaa/my-blog"
breadcrumbs: true
comments:
  provider: "utterances"
  utterances:
    theme: "github-dark"
    issue_term: "pathname"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: false

# 게시글 주소(URL) 규칙 변경 (날짜 폴더 숨기기)
permalink: /:categories/:title/

# 사이트에 공개하지 않을 파일 (작성 가이드·디자인 문서·Agent 설정)
exclude:
  - CLAUDE.md
  - DESIGN.md
  - README.md
  - .claude
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  # IntelliJ 실습 프로젝트 원본(chap01-java-basic 등). .idea·out·.class까지 그대로 발행되는 걸 막는다.
  # 게시글에 필요한 소스만 assets/code/에 복사해서 {% include code-popup.html %}로 보여준다.
  - "chap*"
  - notion

# 방명록(홈) — giscus. https://giscus.app 에서 category_id를 받아 채운다.
# 준비: 저장소 Settings > Features > Discussions 켜기 → Discussions에 'Guestbook' 카테고리(Announcements 형식) 만들기 → giscus 앱 설치
giscus:
  repo: "paaaraaaeaaa/my-blog"
  repo_id: "R_kgDOUGl-zA"
  category: "Guestbook"
  category_id: "DIC_kwDOUGl-zM4DHUdP"
  term: "guestbook"
