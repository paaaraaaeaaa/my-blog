title: 예린님의 학습 노트
remote_theme: "mmistakes/minimal-mistakes"
url: "https://paaaraaaeaaa.github.io"
baseurl: "/my-blog"
plugins:
  - jekyll-include-cache

# 🔗 링크 공유(카카오톡/문자/디스코드 등) 시 미리보기에 쓰일 설명 + 이미지
# description: 미리보기 카드에 나올 한 줄 소개
# logo: 미리보기 카드에 나올 대표 이미지 (og:image). 이걸 지정 안 하면
#       일부 메신저 앱이 페이지에서 처음 보이는 이미지(=프로필 사진)를 멋대로 가져다 씀.
description: "데이터 분석과 클라우드 아키텍처를 공부하며 매일 배운 내용을 기록하는 학습 블로그입니다."
logo: "/assets/images/og-banner.png"

# 🎨 테마 스킨 변경 (dark, air, mint 중 택 1)
minimal_mistakes_skin: "mint"

# 미래 날짜로 작성해도 바로 게시되도록 허용
future: true

# 🔍 사이트 전체 검색 기능 (상단 돋보기 아이콘)
search: true
search_full_content: true

# 👤 좌측 프로필 설정
author:
  name: "김예린"
  bio: "데이터 분석과 클라우드 아키텍처에 관심이 많은 대학생입니다."
  avatar: "/assets/images/profile.png"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/paaaraaaeaaa"

# 💬 댓글 기능 켜기 (GitHub 계정 연동)
repository: "paaaraaaeaaa/my-blog"
breadcrumbs: true
comments:
  provider: "utterances"
  utterances:
    theme: "github-light"
    issue_term: "pathname"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true

# 게시글 주소(URL) 규칙 변경 (날짜 폴더 숨기기)
permalink: /:categories/:title/
