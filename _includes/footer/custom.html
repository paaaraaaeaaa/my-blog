<script>
document.addEventListener('DOMContentLoaded', function () {
  // 1. 코드 복사 버튼
  document.querySelectorAll('pre').forEach(function (pre) {
    if (pre.parentElement && pre.parentElement.querySelector(':scope > .code-copy-btn')) return;

    var codeEl = pre.querySelector('code') || pre;

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'code-copy-btn';
    btn.textContent = '복사';
    btn.addEventListener('click', function () {
      var text = codeEl.innerText;
      var done = function (ok) {
        btn.textContent = ok ? '복사됨!' : '실패';
        setTimeout(function () { btn.textContent = '복사'; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done(true); }).catch(function () { done(false); });
      } else {
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(true); } catch (e) { done(false); }
        document.body.removeChild(ta);
      }
    });

    pre.style.position = 'relative';
    pre.appendChild(btn);
  });

  // 2. 상단바 + 글 경로(breadcrumb) 높이를 합쳐서 여백/sticky 위치 자동 보정
  function adjustFixedOffsets() {
    var masthead = document.querySelector('.masthead');
    var breadcrumbs = document.querySelector('.breadcrumbs');
    var mHeight = masthead ? masthead.offsetHeight : 0;

    if (breadcrumbs) {
      breadcrumbs.style.top = mHeight + 'px';
    }
    var bHeight = breadcrumbs ? breadcrumbs.offsetHeight : 0;
    var totalOffset = mHeight + bHeight;

    document.body.style.paddingTop = totalOffset + 'px';
    document.documentElement.style.setProperty('--fixed-offset', totalOffset + 'px');
  }
  adjustFixedOffsets();
  window.addEventListener('resize', adjustFixedOffsets);

  // 2-1. 목차(TOC)·앵커 링크 클릭 시, 고정된 상단바+경로줄에 제목이 가려지지
  //      않도록 직접 스크롤 위치를 계산해서 이동시킴 (테마 자체 스크롤 동작을 덮어씀)
  function getFixedOffset() {
    var raw = getComputedStyle(document.documentElement).getPropertyValue('--fixed-offset');
    var n = parseInt(raw, 10);
    return (isNaN(n) ? 110 : n) + 20; // 여유 여백 20px
  }

  function scrollToHashTarget(hash, smooth) {
    if (!hash || hash === '#') return;
    var id = decodeURIComponent(hash.slice(1));
    var target = document.getElementById(id) || document.getElementsByName(id)[0];
    if (!target) return;
    var y = target.getBoundingClientRect().top + window.pageYOffset - getFixedOffset();
    window.scrollTo({ top: y < 0 ? 0 : y, behavior: smooth ? 'smooth' : 'auto' });
  }

  // 페이지 안의 모든 "#anchor" 링크(목차 포함)를 가로채서 직접 이동시킴
  document.querySelectorAll('a[href*="#"]').forEach(function (a) {
    var href = a.getAttribute('href') || '';
    var hashIndex = href.indexOf('#');
    if (hashIndex === -1) return;
    var hash = href.slice(hashIndex);
    var pathPart = href.slice(0, hashIndex);
    // 같은 페이지 안의 링크만 처리 (다른 글로 가는 링크는 그대로 둠)
    if (pathPart && pathPart !== window.location.pathname && pathPart !== '') return;
    if (hash.length <= 1) return;

    a.addEventListener('click', function (e) {
      var id = decodeURIComponent(hash.slice(1));
      if (!document.getElementById(id) && !document.getElementsByName(id)[0]) return;
      e.preventDefault();
      history.pushState(null, '', hash);
      scrollToHashTarget(hash, true);
    });
  });

  // 글을 #anchor가 붙은 링크로 바로 열었을 때도 같은 방식으로 보정
  if (window.location.hash) {
    setTimeout(function () { scrollToHashTarget(window.location.hash, false); }, 60);
  }

  // 3. 색깔 콜아웃 박스 자동 적용 (💡 🔴 🟢 ⚠️ 🚨 로 시작하는 문단/목록)
  //    목차(sidebar__right) 안의 항목은 제외
  var markers = [
    { emoji: '💡', cls: 'callout-summary' },
    { emoji: '🔴', cls: 'callout-error' },
    { emoji: '🟢', cls: 'callout-solution' },
    { emoji: '⚠️', cls: 'callout-warning' },
    { emoji: '🚨', cls: 'callout-warning' }
  ];
  document.querySelectorAll('.page__content > p, .page__content li').forEach(function (el) {
    if (el.closest('.sidebar__right')) return;
    var text = el.textContent.trim();
    for (var i = 0; i < markers.length; i++) {
      if (text.indexOf(markers[i].emoji) === 0) {
        el.classList.add('callout', markers[i].cls);
        break;
      }
    }
  });

  // 4. 긴 코드 블록(15줄 초과) 접기/펼치기로 감싸기
  document.querySelectorAll('.page__content pre').forEach(function (pre) {
    if (pre.closest('.sidebar__right')) return;
    var lineCount = (pre.textContent.match(/\n/g) || []).length;
    if (lineCount <= 15) return;

    var target = pre.closest('div.highlighter-rouge, figure.highlight') || pre;
    if (target.closest('details.code-collapse')) return;

    var details = document.createElement('details');
    details.className = 'code-collapse';
    var summary = document.createElement('summary');
    summary.textContent = '코드 보기/접기 (' + (lineCount + 1) + '줄)';

    target.parentNode.insertBefore(details, target);
    details.appendChild(summary);
    details.appendChild(target);
  });

  // 5. "- **용어**" + 하위 설명 목록 패턴을 개념 카드처럼 구분 (목차 제외)
  document.querySelectorAll('.page__content li').forEach(function (li) {
    if (li.closest('.sidebar__right')) return;
    var strongChild = li.querySelector(':scope > strong');
    var nestedList = li.querySelector(':scope > ul, :scope > ol');
    if (strongChild && nestedList) {
      li.classList.add('concept-term');
    }
  });

  // 6. 오늘 방문자 뱃지: 날짜별로 다른 page_id를 써서 그날그날 새로 세도록 함
  var todayBadge = document.getElementById('visitor-today-badge');
  if (todayBadge) {
    var todayStr = new Date().toISOString().slice(0, 10);
    todayBadge.src = 'https://visitor-badge.laobi.icu/badge?page_id=paaaraaaeaaa.my-blog-daily-' + todayStr + '&left_color=555555&right_color=4285f4';
  }

  // 7. 링크 복사 버튼 (홈 화면 방문자 박스 안)
  var copyBtn = document.getElementById('copy-link-btn');
  if (copyBtn) {
    copyBtn.addEventListener('click', function () {
      var url = window.location.href;
      var done = function (ok) {
        copyBtn.textContent = ok ? '복사됨!' : '실패';
        setTimeout(function () { copyBtn.textContent = '🔗 이 페이지 링크 복사'; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () { done(true); }).catch(function () { done(false); });
      } else {
        var ta = document.createElement('textarea');
        ta.value = url;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(true); } catch (e) { done(false); }
        document.body.removeChild(ta);
      }
    });
  }
});
</script>

{% if page.date %}
<script>
document.addEventListener('DOMContentLoaded', function () {
  // 8. 게시글 조회수 뱃지: 경로(breadcrumb) 줄 오른쪽 끝에 붙임 (게시글에서만, date가 있는 글에만)
  var bc = document.querySelector('.breadcrumbs');
  if (bc) {
    var key = 'paaaraaaeaaa.my-blog-view' + window.location.pathname.replace(/\//g, '-');
    var badge = document.createElement('span');
    badge.className = 'page-view-badge';
    var img = document.createElement('img');
    img.src = 'https://visitor-badge.laobi.icu/badge?page_id=' + encodeURIComponent(key) + '&left_color=555555&right_color=4285f4&left_text=views';
    img.alt = '조회수';
    badge.appendChild(img);
    bc.appendChild(badge);
  }
});
</script>
{% endif %}
