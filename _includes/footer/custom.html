<script>
document.addEventListener('DOMContentLoaded', function () {
  // 1. 코드 복사 버튼
  document.querySelectorAll('pre').forEach(function (pre) {
    if (pre.parentElement && pre.parentElement.querySelector(':scope > .code-copy-btn')) return;

    var codeEl = pre.querySelector('code') || pre;

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'code-copy-btn';
    btn.textContent = '복사';
    btn.addEventListener('click', function () {
      var text = codeEl.innerText;
      var done = function (ok) {
        btn.textContent = ok ? '복사됨!' : '실패';
        setTimeout(function () { btn.textContent = '복사'; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done(true); }).catch(function () { done(false); });
      } else {
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(true); } catch (e) { done(false); }
        document.body.removeChild(ta);
      }
    });

    pre.style.position = 'relative';
    pre.appendChild(btn);
  });

  // 1-1. 상단 탭(Cloud/Database/Projects) 중 지금 보고 있는 섹션에 강조 표시
  document.querySelectorAll('.greedy-nav .visible-links a').forEach(function (a) {
    try {
      var linkPath = new URL(a.href).pathname.replace(/\/$/, '');
      var curPath = window.location.pathname.replace(/\/$/, '');
      if (linkPath && curPath.indexOf(linkPath) === 0) {
        a.classList.add('nav-current');
      }
    } catch (e) {}
  });

  // 2. 상단바 + 글 경로(breadcrumb) 높이를 합쳐서 여백/sticky 위치 자동 보정
  function adjustFixedOffsets() {
    var masthead = document.querySelector('.masthead');
    var breadcrumbs = document.querySelector('.breadcrumbs');
    var mHeight = masthead ? masthead.offsetHeight : 0;

    if (breadcrumbs) {
      breadcrumbs.style.top = mHeight + 'px';
    }
    var bHeight = breadcrumbs ? breadcrumbs.offsetHeight : 0;
    var totalOffset = mHeight + bHeight;

    document.body.style.paddingTop = totalOffset + 'px';
    document.documentElement.style.setProperty('--fixed-offset', totalOffset + 'px');
  }
  adjustFixedOffsets();
  window.addEventListener('resize', adjustFixedOffsets);

  // 3. 색깔 콜아웃 박스 자동 적용 (💡 🔴 🟢 ⚠️ 🚨 로 시작하는 문단/목록)
  //    목차(sidebar__right) 안의 항목은 제외
  var markers = [
    { emoji: '💡', cls: 'callout-summary' },
    { emoji: '🔴', cls: 'callout-error' },
    { emoji: '🟢', cls: 'callout-solution' },
    { emoji: '⚠️', cls: 'callout-warning' },
    { emoji: '🚨', cls: 'callout-warning' }
  ];
  document.querySelectorAll('.page__content > p, .page__content li').forEach(function (el) {
    if (el.closest('.sidebar__right')) return;
    var text = el.textContent.trim();
    for (var i = 0; i < markers.length; i++) {
      if (text.indexOf(markers[i].emoji) === 0) {
        el.classList.add('callout', markers[i].cls);
        break;
      }
    }
  });

  // 3-1. 표를 가로 스크롤 틀로 감싸기 (좁은 화면에서 본문이 옆으로 밀리지 않도록)
  document.querySelectorAll('.page__content table').forEach(function (table) {
    if (table.closest('.table-scroll') || table.closest('.sidebar__right')) return;
    var wrap = document.createElement('div');
    wrap.className = 'table-scroll';
    table.parentNode.insertBefore(wrap, table);
    wrap.appendChild(table);
  });
  // 3-2. 코드 블록 언어 라벨 (```bash → "bash")
  document.querySelectorAll('.page__content div.highlighter-rouge').forEach(function (block) {
    var m = block.className.match(/language-([\w+-]+)/);
    if (!m || m[1] === 'plaintext' || m[1] === 'text' || block.querySelector('.code-lang')) return;
    var names = { js: 'JavaScript', javascript: 'JavaScript', ts: 'TypeScript', typescript: 'TypeScript', jsx: 'JSX', tsx: 'TSX',
      html: 'HTML', css: 'CSS', scss: 'SCSS', bash: 'bash', shell: 'shell', sh: 'shell', zsh: 'zsh', powershell: 'PowerShell', ps1: 'PowerShell',
      python: 'Python', py: 'Python', json: 'JSON', yaml: 'YAML', yml: 'YAML', sql: 'SQL', markdown: 'Markdown', md: 'Markdown', diff: 'diff', mermaid: 'Mermaid' };
    var tag = document.createElement('span');
    tag.className = 'code-lang';
    tag.textContent = names[m[1].toLowerCase()] || m[1];
    block.appendChild(tag);
  });
  // 4. 긴 코드 블록(15줄 초과) 접기/펼치기로 감싸기
  document.querySelectorAll('.page__content pre').forEach(function (pre) {
    if (pre.closest('.sidebar__right')) return;
    var lineCount = (pre.textContent.match(/\n/g) || []).length;
    if (lineCount <= 15) return;

    var target = pre.closest('div.highlighter-rouge, figure.highlight') || pre;
    if (target.closest('details.code-collapse')) return;

    var details = document.createElement('details');
    details.className = 'code-collapse';
    var summary = document.createElement('summary');
    summary.textContent = '코드 보기/접기 (' + (lineCount + 1) + '줄)';

    target.parentNode.insertBefore(details, target);
    details.appendChild(summary);
    details.appendChild(target);
  });

  // 5. "- **용어**" + 하위 설명 목록 패턴을 개념 카드처럼 구분 (목차 제외)
  document.querySelectorAll('.page__content li').forEach(function (li) {
    if (li.closest('.sidebar__right')) return;
    var strongChild = li.querySelector(':scope > strong');
    var nestedList = li.querySelector(':scope > ul, :scope > ol');
    if (strongChild && nestedList) {
      li.classList.add('concept-term');
    }
  });

  // 5-1. 게시글 본문 이미지: 클릭하면 확대해서 보여줌 (코드 복사 버튼처럼 자동 적용)
  var postImgs = document.querySelectorAll('.page__content img');
  if (postImgs.length > 0) {
    var zoomOverlay = document.createElement('div');
    zoomOverlay.className = 'img-zoom';
    zoomOverlay.setAttribute('role', 'dialog');
    zoomOverlay.setAttribute('aria-modal', 'true');
    zoomOverlay.setAttribute('aria-label', '이미지 확대 보기');
    zoomOverlay.hidden = true;

    var zoomClose = document.createElement('button');
    zoomClose.type = 'button';
    zoomClose.className = 'img-zoom__close';
    zoomClose.textContent = '[esc] 닫기';

    var zoomImg = document.createElement('img');
    zoomImg.className = 'img-zoom__img';

    zoomOverlay.appendChild(zoomClose);
    zoomOverlay.appendChild(zoomImg);
    document.body.appendChild(zoomOverlay);

    var lastTrigger = null;

    var closeZoom = function () {
      zoomOverlay.hidden = true;
      zoomImg.classList.remove('is-zoomed');
      zoomImg.src = '';
      document.body.style.overflow = '';
      if (lastTrigger) { lastTrigger.focus(); lastTrigger = null; }
    };

    var openZoom = function (img) {
      lastTrigger = img;
      zoomImg.src = img.currentSrc || img.src;
      zoomImg.alt = img.alt || '';
      zoomImg.classList.remove('is-zoomed');
      zoomOverlay.hidden = false;
      document.body.style.overflow = 'hidden';
      zoomClose.focus();
    };

    postImgs.forEach(function (img) {
      img.classList.add('is-zoomable');
      img.tabIndex = 0;
      img.setAttribute('role', 'button');
      img.setAttribute('aria-label', (img.alt ? img.alt + ' - ' : '') + '이미지 확대');
      img.addEventListener('click', function () { openZoom(img); });
      img.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openZoom(img); }
      });
    });

    // 확대 화면 안 이미지를 다시 누르면 실제 크기로 토글 (엑셀 확대/축소 느낌)
    zoomImg.addEventListener('click', function (e) {
      e.stopPropagation();
      zoomImg.classList.toggle('is-zoomed');
    });
    zoomOverlay.addEventListener('click', function (e) {
      if (e.target === zoomOverlay) closeZoom();
    });
    zoomClose.addEventListener('click', closeZoom);
    document.addEventListener('keydown', function (e) {
      if (!zoomOverlay.hidden && e.key === 'Escape') closeZoom();
    });
  }

  // 5-2. 게시글 원본 코드 팝업: code-popup include(_includes/code-popup.html)로 넣은 버튼을 누르면
  //      assets/code/<dir>/ 트리를 폴더 → 파일 순으로 탐색하다가, 파일을 고르면 fetch로 가져와 보여줌
  var codeTriggers = document.querySelectorAll('.page__content .code-popup-trigger');
  if (codeTriggers.length > 0) {
    var codeOverlay = document.createElement('div');
    codeOverlay.className = 'code-popup';
    codeOverlay.setAttribute('role', 'dialog');
    codeOverlay.setAttribute('aria-modal', 'true');
    codeOverlay.setAttribute('aria-label', '원본 코드 보기');
    codeOverlay.hidden = true;

    var codeWin = document.createElement('div');
    codeWin.className = 'code-popup__win term';

    var codeBar = document.createElement('div');
    codeBar.className = 'term__bar';

    var codePath = document.createElement('span');
    codePath.className = 'term__path';

    var codeActions = document.createElement('div');
    codeActions.className = 'code-popup__actions';

    var codeBackBtn = document.createElement('button');
    codeBackBtn.type = 'button';
    codeBackBtn.className = 'code-popup__btn';
    codeBackBtn.textContent = '← 목록';

    var codeCopyBtn = document.createElement('button');
    codeCopyBtn.type = 'button';
    codeCopyBtn.className = 'code-copy-btn';
    codeCopyBtn.textContent = '복사';

    var codeCloseBtn = document.createElement('button');
    codeCloseBtn.type = 'button';
    codeCloseBtn.className = 'code-popup__btn';
    codeCloseBtn.textContent = '[esc] 닫기';

    codeActions.appendChild(codeBackBtn);
    codeActions.appendChild(codeCopyBtn);
    codeActions.appendChild(codeCloseBtn);
    codeBar.appendChild(codePath);
    codeBar.appendChild(codeActions);

    // 코드 | 실행 결과 탭 (실행 결과 파일이 있는 .java 를 열었을 때만 보인다)
    var codeTabs = document.createElement('div');
    codeTabs.className = 'code-popup__tabs';
    codeTabs.setAttribute('role', 'tablist');
    codeTabs.hidden = true;
    var codeTabCode = document.createElement('button');
    var codeTabOut = document.createElement('button');
    [[codeTabCode, '코드'], [codeTabOut, '실행 결과']].forEach(function (pair) {
      pair[0].type = 'button';
      pair[0].className = 'code-popup__tab';
      pair[0].setAttribute('role', 'tab');
      pair[0].textContent = pair[1];
      codeTabs.appendChild(pair[0]);
    });
    var codeNote = document.createElement('p');
    codeNote.className = 'code-popup__note';
    codeNote.textContent = '한 번 실행한 결과예요. 난수·시간을 쓰는 코드는 실행할 때마다 달라질 수 있어요.';
    codeNote.hidden = true;

    var codeList = document.createElement('div');
    codeList.className = 'code-popup__list';

    var codePre = document.createElement('pre');
    codePre.className = 'code-popup__body';
    var codeBody = document.createElement('code');
    codePre.appendChild(codeBody);

    codeWin.appendChild(codeBar);
    codeWin.appendChild(codeTabs);
    codeWin.appendChild(codeNote);
    codeWin.appendChild(codeList);
    codeWin.appendChild(codePre);
    codeOverlay.appendChild(codeWin);
    document.body.appendChild(codeOverlay);

    var codeLastTrigger = null;
    var codeTreesByDir = {};
    var codeTextCache = {};
    var codeDir = '';
    var codePathStack = [];

    // X.out.txt 는 X.java 의 "실행 결과" 파일이다. 목록에는 올리지 않고 X.java 에 붙인다.
    var codeOutsByDir = {};
    var OUT_SUFFIX = '.out.txt';

    var buildTree = function (files, outs) {
      var root = {};
      files.forEach(function (f) {
        if (f.path.slice(-OUT_SUFFIX.length) === OUT_SUFFIX) {
          outs[f.path.slice(0, -OUT_SUFFIX.length) + '.java'] = f.url;
          return;
        }
        var parts = f.path.split('/');
        var node = root;
        for (var i = 0; i < parts.length - 1; i++) {
          var seg = parts[i];
          if (!node[seg]) node[seg] = {};
          node = node[seg];
        }
        node[parts[parts.length - 1]] = f.url;
      });
      return root;
    };

    var getTree = function (dir) {
      if (codeTreesByDir[dir]) return codeTreesByDir[dir];
      var dataEl = document.querySelector('.code-popup-data[data-dir="' + dir + '"]');
      var files = [];
      try { files = JSON.parse((dataEl && dataEl.textContent) || '[]'); } catch (e) { files = []; }
      var outs = {};
      var tree = buildTree(files, outs);
      codeTreesByDir[dir] = tree;
      codeOutsByDir[dir] = outs;
      return tree;
    };

    // 지금 폴더(codePathStack) 안 파일 name 의 실행 결과 주소 (없으면 '')
    var outUrlFor = function (name) {
      getTree(codeDir);
      return (codeOutsByDir[codeDir] || {})[codePathStack.concat(name).join('/')] || '';
    };

    var nodeAtPath = function (tree, pathStack) {
      var node = tree;
      for (var i = 0; i < pathStack.length; i++) { node = node[pathStack[i]] || {}; }
      return node;
    };

    var showList = function () {
      codePre.hidden = true;
      codeList.hidden = false;
      codeBackBtn.hidden = true;
      codeCopyBtn.hidden = true;
      codeTabs.hidden = true;
      codeNote.hidden = true;
    };

    var showFile = function () {
      codePre.hidden = false;
      codeList.hidden = true;
      codeBackBtn.hidden = false;
      codeCopyBtn.hidden = false;
    };

    var renderList = function () {
      showList();
      codePath.textContent = '~/' + codeDir + (codePathStack.length ? '/' + codePathStack.join('/') : '');
      codeList.innerHTML = '';
      var node = nodeAtPath(getTree(codeDir), codePathStack);

      if (codePathStack.length > 0) {
        var upRow = document.createElement('button');
        upRow.type = 'button';
        upRow.className = 'code-popup__row code-popup__row--up';
        upRow.textContent = '../';
        upRow.addEventListener('click', function () { codePathStack.pop(); renderList(); });
        codeList.appendChild(upRow);
      }

      var names = Object.keys(node).sort();
      names.forEach(function (name) {
        var value = node[name];
        var row = document.createElement('button');
        row.type = 'button';
        if (typeof value === 'string') {
          row.className = 'code-popup__row code-popup__row--file';
          row.textContent = name;
          var outUrl = outUrlFor(name);
          if (outUrl) {
            var mark = document.createElement('span');
            mark.className = 'code-popup__mark';
            mark.textContent = '+ 실행 결과';
            row.appendChild(mark);
          }
          row.addEventListener('click', function () { openFile(name, value); });
        } else {
          row.className = 'code-popup__row code-popup__row--dir';
          row.textContent = name + '/';
          row.addEventListener('click', function () { codePathStack.push(name); renderList(); });
        }
        codeList.appendChild(row);
      });

      if (names.length === 0 && codePathStack.length === 0) {
        var empty = document.createElement('p');
        empty.className = 'code-popup__row';
        empty.textContent = '표시할 파일이 없습니다.';
        codeList.appendChild(empty);
      }

      // 폴더 이동/뒤로가기로 다시 그릴 때마다 이전 버튼이 DOM에서 사라지므로,
      // 포커스가 body로 빠지지 않도록 목록의 첫 행으로 옮겨준다.
      var firstRow = codeList.querySelector('button');
      if (firstRow) firstRow.focus();
    };

    var codeLoadSeq = 0;
    var loadCodeText = function (url, failMsg) {
      var seq = ++codeLoadSeq;                    // 빨리 파일/탭을 바꿨을 때 늦게 온 응답이 덮어쓰지 않게
      if (codeTextCache[url] !== undefined) {
        codeBody.textContent = codeTextCache[url];
        return;
      }
      codeBody.textContent = '불러오는 중...';
      fetch(url).then(function (res) {
        if (!res.ok) throw new Error('not found');
        return res.text();
      }).then(function (text) {
        codeTextCache[url] = text;
        if (seq === codeLoadSeq) codeBody.textContent = text;
      }).catch(function () {
        if (seq === codeLoadSeq) codeBody.textContent = failMsg + url;
      });
    };

    var openFile = function (name, url) {
      showFile();
      codePath.textContent = '~/' + codeDir + (codePathStack.length ? '/' + codePathStack.join('/') : '') + '/' + name;
      var outUrl = outUrlFor(name);

      var pick = function (showOut) {
        codeTabCode.classList.toggle('is-active', !showOut);
        codeTabOut.classList.toggle('is-active', showOut);
        codeTabCode.setAttribute('aria-selected', showOut ? 'false' : 'true');
        codeTabOut.setAttribute('aria-selected', showOut ? 'true' : 'false');
        codeNote.hidden = !showOut;
        if (showOut) loadCodeText(outUrl, '실행 결과를 불러오지 못했습니다: ');
        else loadCodeText(url, '코드를 불러오지 못했습니다: ');
      };

      codeTabs.hidden = !outUrl;
      codeTabCode.onclick = function () { pick(false); };
      codeTabOut.onclick = function () { pick(true); };
      pick(false);
    };

    var closeCodePopup = function () {
      codeOverlay.hidden = true;
      document.body.style.overflow = '';
      if (codeLastTrigger) { codeLastTrigger.focus(); codeLastTrigger = null; }
    };

    var openCodePopup = function (btn) {
      codeLastTrigger = btn;
      codeDir = btn.getAttribute('data-dir');
      codePathStack = [];
      codeOverlay.hidden = false;
      document.body.style.overflow = 'hidden';
      renderList();
      codeCloseBtn.focus();
    };

    codeTriggers.forEach(function (btn) {
      btn.addEventListener('click', function () { openCodePopup(btn); });
    });

    codeBackBtn.addEventListener('click', renderList);

    codeCopyBtn.addEventListener('click', function () {
      var text = codeBody.textContent;
      var done = function (ok) {
        codeCopyBtn.textContent = ok ? '복사됨!' : '실패';
        setTimeout(function () { codeCopyBtn.textContent = '복사'; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done(true); }).catch(function () { done(false); });
      } else {
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(true); } catch (e) { done(false); }
        document.body.removeChild(ta);
      }
    });

    codeCloseBtn.addEventListener('click', closeCodePopup);
    codeOverlay.addEventListener('click', function (e) { if (e.target === codeOverlay) closeCodePopup(); });
    document.addEventListener('keydown', function (e) {
      if (!codeOverlay.hidden && e.key === 'Escape') closeCodePopup();
    });
  }

  // 6. 오늘 방문자 뱃지: 날짜별로 다른 page_id를 써서 그날그날 새로 세도록 함
  //    (주의) new Date().toISOString()은 항상 UTC 기준 날짜를 반환해서,
  //    한국 시간으로는 자정이 아니라 "오전 9시"에 날짜가 바뀌는 버그가 있었음.
  //    그래서 한국 시간(KST, UTC+9) 기준 날짜로 직접 보정해서 계산함.
  var todayBadge = document.getElementById('visitor-today-badge');
  if (todayBadge) {
    var kstNow = new Date(Date.now() + 9 * 60 * 60 * 1000);
    var todayStr = kstNow.toISOString().slice(0, 10);
    todayBadge.src = 'https://visitor-badge.laobi.icu/badge?page_id=paaaraaaeaaa.my-blog-daily-' + todayStr + '&left_color=161B22&right_color=238636';
  }

  // 7. 링크 복사 버튼 (홈 화면 방문자 박스 안)
  var copyBtn = document.getElementById('copy-link-btn');
  if (copyBtn) {
    copyBtn.addEventListener('click', function () {
      var url = window.location.href;
      var done = function (ok) {
        copyBtn.textContent = ok ? 'copied!' : 'failed';
        setTimeout(function () { copyBtn.textContent = 'copy link'; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () { done(true); }).catch(function () { done(false); });
      } else {
        var ta = document.createElement('textarea');
        ta.value = url;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(true); } catch (e) { done(false); }
        document.body.removeChild(ta);
      }
    });
  }

  // 7-1. 왼쪽 프로필의 GitHub 링크 목록 밑에 "이메일 복사" 항목을 추가
  var authorLinks = document.querySelector('.author__urls');
  if (authorLinks) {
    var emailAddress = 'yerin067@gmail.com';
    var li = document.createElement('li');
    var emailBtn = document.createElement('button');
    emailBtn.type = 'button';
    emailBtn.id = 'copy-email-btn';
    emailBtn.className = 'author-email-btn';
    emailBtn.innerHTML = '<i class="fas fa-fw fa-envelope" aria-hidden="true"></i> <span>' + emailAddress + '</span>';
    li.appendChild(emailBtn);
    authorLinks.appendChild(li);

    emailBtn.addEventListener('click', function () {
      var labelSpan = emailBtn.querySelector('span');
      var done = function (ok) {
        labelSpan.textContent = ok ? '복사됨!' : '실패';
        setTimeout(function () { labelSpan.textContent = emailAddress; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(emailAddress).then(function () { done(true); }).catch(function () { done(false); });
      } else {
        var ta = document.createElement('textarea');
        ta.value = emailAddress;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(true); } catch (e) { done(false); }
        document.body.removeChild(ta);
      }
    });
  }
});
</script>

<!-- 9. Mermaid 다이어그램 렌더링: ```mermaid 코드블록을 실제 그림으로 그려줌 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (typeof mermaid === 'undefined') return;

  // kramdown이 ```mermaid 코드블록을 <pre><code class="language-mermaid">...</code></pre> 형태로 렌더링하는데,
  // mermaid.js는 <div class="mermaid">원본 텍스트</div> 형태를 찾아서 그림으로 바꿔주기 때문에
  // 코드블록을 찾아서 div.mermaid로 바꿔치기 해줌.
  var blocks = document.querySelectorAll('code.language-mermaid, code.language-Mermaid');
  if (blocks.length === 0) return;

  blocks.forEach(function (codeEl) {
    var graphText = codeEl.textContent;
    var wrapper = codeEl.closest('div.highlighter-rouge') || codeEl.closest('figure.highlight') || codeEl.closest('pre');
    if (!wrapper) wrapper = codeEl;

    var div = document.createElement('div');
    div.className = 'mermaid';
    div.setAttribute('data-src', graphText);   // 테마를 바꿀 때 다시 그리기 위해 원본 보관
    div.textContent = graphText;
    wrapper.parentNode.replaceChild(div, wrapper);
  });

  // 다이어그램 색도 tokens.css 값을 그대로 읽어서 쓴다 (색을 여기 따로 적지 않음)
  function renderMermaid() {
    var css = getComputedStyle(document.documentElement);
    var t = function (name) { return css.getPropertyValue(name).trim(); };
    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: {
        darkMode: document.documentElement.getAttribute('data-theme') !== 'light',
        background: t('--c-surface'),
        fontFamily: t('--font-sans'),
        primaryColor: t('--c-surface-2'),
        primaryTextColor: t('--c-text'),
        primaryBorderColor: t('--c-signal'),
        secondaryColor: t('--c-surface'),
        tertiaryColor: t('--c-bg'),
        lineColor: t('--c-text-3'),
        textColor: t('--c-text-2'),
        mainBkg: t('--c-surface-2'),
        nodeBorder: t('--c-signal'),
        clusterBkg: t('--c-bg'),
        clusterBorder: t('--c-line-strong'),
        edgeLabelBackground: t('--c-surface'),
        actorBkg: t('--c-surface-2'),
        actorBorder: t('--c-signal'),
        actorTextColor: t('--c-text'),
        signalColor: t('--c-text-2'),
        signalTextColor: t('--c-text'),
        noteBkgColor: t('--c-surface'),
        noteTextColor: t('--c-text-2'),
        noteBorderColor: t('--c-line-strong'),
        git0: t('--c-cloud'), git1: t('--c-database'), git2: t('--c-projects'), git3: t('--c-success')
      }
    });
    document.querySelectorAll('.mermaid[data-src]').forEach(function (el) {
      el.removeAttribute('data-processed');
      el.textContent = el.getAttribute('data-src');
    });
    mermaid.run({ querySelector: '.mermaid' });
  }
  renderMermaid();
  document.addEventListener('themechange', renderMermaid);
});
</script>

    document.body.appendChild(top);
    var ticking = false;
    window.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () {
        top.classList.toggle('is-visible', window.scrollY > window.innerHeight);
        ticking = false;
      });
    }, { passive: true });
    top.addEventListener('click', function () {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    });

  // 모바일 메뉴: 현재 섹션 표시 + 열고 닫기
  var btn = document.querySelector('.mnav__toggle');

  menu.querySelectorAll('a').forEach(function (a) {

  });
  function setOpen(open) {
    menu.hidden = !open;
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.classList.toggle('is-open', open);
  }
  btn.addEventListener('click', function (e) { e.stopPropagation(); setOpen(menu.hidden); });
  document.addEventListener('click', function (e) { if (!menu.hidden && !menu.contains(e.target)) setOpen(false); });

<script>
// 10. 모션: 스크롤 등장 · 터미널 순서 · 읽기 진행선 · 제목 디코드 (DESIGN.md 2.4)
document.addEventListener('DOMContentLoaded', function () {
  // 홈 last login: 지난 세션의 마지막 방문 시각 (세션 첫 페이지에서 기록)
  var now = Date.now(), prev = null;
  try {
    prev = sessionStorage.getItem('prevVisit');
    if (prev === null) {
      prev = localStorage.getItem('lastVisit') || '';
      sessionStorage.setItem('prevVisit', prev);
      localStorage.setItem('lastVisit', String(now));
    }
  } catch (e) { prev = null; }
  var ll = document.querySelector('[data-last-login]');
  if (ll && prev === null) ll.hidden = true;
  else if (ll) {
    var ts = parseInt(prev, 10);
    if (!ts) { ll.textContent = 'last login: first visit'; }
    else {
      var d = new Date(ts), z = function (n) { return (n < 10 ? '0' : '') + n; };
      var mins = Math.max(0, Math.round((now - ts) / 60000));
      var ago = mins < 60 ? mins + 'm' : mins < 1440 ? Math.floor(mins / 60) + 'h' : Math.floor(mins / 1440) + 'd';
      ll.textContent = 'last login: ' + d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()) + ' (' + ago + ' ago)';
    }
  }

  // 목차 표시선: 지금 읽는 항목(스크롤 추적이 .active를 붙임) 옆으로 이동
  var toc = document.querySelector('nav.toc'), menu = toc && toc.querySelector('.toc__menu');
  if (menu && window.MutationObserver) {
    var marker = document.createElement('span');
    marker.className = 'toc__marker';
    marker.setAttribute('aria-hidden', 'true');
    menu.appendChild(marker);
    var place = function () {
      var act = menu.querySelectorAll('li.active > a');
      var a = act[act.length - 1];
      var m = menu.getBoundingClientRect(), r = a && a.getBoundingClientRect();
      if (!a || !r.height) { marker.style.opacity = '0'; toc.classList.remove('has-marker'); return; }
      marker.style.transform = 'translate(' + (r.left - m.left) + 'px,' + (r.top - m.top + menu.scrollTop) + 'px) scaleY(' + r.height + ')';
      marker.style.opacity = '1';
      toc.classList.add('has-marker');
      if (!marker.classList.contains('is-ready')) requestAnimationFrame(function () { marker.classList.add('is-ready'); });
    };
    new MutationObserver(place).observe(menu, { attributes: true, attributeFilter: ['class'], subtree: true });
    window.addEventListener('resize', place);
    if (window.ResizeObserver) new ResizeObserver(place).observe(menu);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
    place();
  }

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  // 탭·필터로 영역이 새로 보일 때 호출 (cloud.md, Database.md)
  window.swapIn = function (el) {
    // 영역 전체가 한 번에 올라오므로, 안쪽 항목의 개별 등장은 끈다
    el.querySelectorAll('.will-reveal').forEach(function (c) { c.classList.remove('will-reveal'); });
    el.classList.remove('swap-in');
    void el.offsetWidth;
    el.classList.add('swap-in');
    setTimeout(function () { el.classList.remove('swap-in'); }, 450);
  };

  // 홈 터미널: 자식 순서대로 --i (한 줄씩 찍히게)
  document.querySelectorAll('.term__body').forEach(function (body) {
    Array.prototype.forEach.call(body.children, function (el, i) { el.style.setProperty('--i', Math.min(i, 6)); });
  });

  // 스크롤 등장
  if ('IntersectionObserver' in window) {
    var SEL = '.row-list > li, .res-card, .problem, .stage, .day, .ls__row, .proj-card, .timeline__item, .module-stats .stat, .wdot, .page__content > h2';
    // Projects만 화면 밖으로 나갔다가 다시 들어올 때마다 다시 등장한다. 다른 페이지(Database 포함)는 한 번만
    var replay = /\/projects(\/|$)/i.test(location.pathname);
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) {
          e.target.classList.add('is-in');
          if (!replay) io.unobserve(e.target);
        } else if (replay) {
          e.target.classList.remove('is-in');
        }
      });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.05 });
    document.querySelectorAll(SEL).forEach(function (el) {
      // 태그·용어집 목록은 등장 효과 없이 바로 보인다(태그를 바꾸거나 걸러 보기를 지울 때 다시 나타나지 않게)
      if (el.closest('.term__body, [data-tag-view], [data-gloss-group]')) return;
      var sibs = el.parentElement ? Array.prototype.indexOf.call(el.parentElement.children, el) : 0;
      el.style.setProperty('--i', Math.min(sibs, 8));
      el.classList.add('will-reveal');
      io.observe(el);
    });
  }

  // 읽기 진행선 (게시글에서만)
  if ({% if page.date %}true{% else %}false{% endif %} && document.querySelector('.page__content')) {
    var bar = document.createElement('div');
    bar.className = 'read-progress';
    bar.setAttribute('aria-hidden', 'true');
    document.body.appendChild(bar);
    var tick = false;
    var update = function () {
      var max = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.transform = 'scaleX(' + (max > 0 ? Math.min(window.scrollY / max, 1) : 0) + ')';
      tick = false;
    };
    window.addEventListener('scroll', function () { if (!tick) { tick = true; requestAnimationFrame(update); } }, { passive: true });
    update();
  }

  // 페이지 제목 디코드: 터미널 기호가 글자로 풀린다 (한 번, 0.6초)
  var afterBoot = function (fn) {
    if (document.documentElement.classList.contains('is-booting')) document.addEventListener('boot:done', fn, { once: true });
    else fn();
  };
  var glyphs = '01#$%&*/<>_+=';
  document.querySelectorAll('.page-intro__title, .mission__title').forEach(function (el) {
    var text = el.textContent;
    if (!text.trim() || el.children.length) return;
    el.setAttribute('aria-label', text);
    var start = null, total = 600;
    var step = function (t) {
      if (start === null) start = t;
      var p = Math.min((t - start) / total, 1), n = Math.floor(p * text.length), out = '';
      for (var i = 0; i < text.length; i++) {
        out += (i < n || text[i] === ' ') ? text[i] : glyphs[Math.floor(Math.random() * glyphs.length)];
      }
      el.textContent = out;
      if (p < 1) requestAnimationFrame(step); else el.removeAttribute('aria-label');
    };
    var cs = parseFloat(getComputedStyle(el).animationDelay) * 1000 || 0;
    afterBoot(function () { setTimeout(function () { requestAnimationFrame(step); }, cs); });
  });
});
</script>

<script>
/* [my-blog] 라이트/다크 테마 전환. 색은 tokens.css, 규칙은 DESIGN.md "2.4 테마" */
(function () {
  var root = document.documentElement;
  function current() { return root.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }

  // 외부 위젯 이미지: data-src-light가 있으면 라이트일 때 그 주소로 바꾼다
  function swapImages(theme) {
    document.querySelectorAll('img[data-src-light]').forEach(function (img) {
      if (!img.getAttribute('data-src-dark')) img.setAttribute('data-src-dark', img.getAttribute('src'));
      var next = img.getAttribute(theme === 'light' ? 'data-src-light' : 'data-src-dark');
      if (img.getAttribute('src') !== next) img.setAttribute('src', next);
    });
  }
  // 댓글(utterances) 테마
  function setComments(theme) {
    var frame = document.querySelector('.utterances-frame');
    if (frame && frame.contentWindow) {
      frame.contentWindow.postMessage({ type: 'set-theme', theme: theme === 'light' ? 'github-light' : 'github-dark' }, 'https://utteranc.es');
    }
  }
  function syncMeta() {
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', getComputedStyle(root).getPropertyValue('--c-bg').trim());
  }
  function syncButton(theme) {
    document.querySelectorAll('.theme-toggle').forEach(function (b) {
      b.setAttribute('aria-label', theme === 'light' ? '다크 모드로 바꾸기' : '라이트 모드로 바꾸기');
      b.setAttribute('aria-pressed', theme === 'light' ? 'true' : 'false');
    });
  }
  function apply(theme, save) {
    root.setAttribute('data-theme', theme);
    if (save) { try { localStorage.setItem('theme', theme); } catch (e) {} }
    swapImages(theme); setComments(theme); syncMeta(); syncButton(theme);
    document.dispatchEvent(new CustomEvent('themechange', { detail: { theme: theme } }));
  }

  var wiping = false;
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('.theme-toggle');
    if (!btn) return;
    if (wiping) return;                       // 원형 전환 중 연타는 무시
    var next = current() === 'light' ? 'dark' : 'light';
    var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (calm) { apply(next, true); return; }  // 모션을 줄인 환경: 즉시 바꾼다
    if (document.startViewTransition) {
      try {
        // 누른 버튼 자리에서 원형으로 퍼지는 전환
        var r = btn.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
        root.style.setProperty('--vt-x', x + 'px');
        root.style.setProperty('--vt-y', y + 'px');
        root.style.setProperty('--vt-r', Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + 'px');
        root.classList.add('theme-wipe');
        wiping = true;
        var vt = document.startViewTransition(function () { apply(next, true); });
        var clean = function () { wiping = false; root.classList.remove('theme-wipe'); };
        vt.ready.catch(function () {});
        vt.finished.then(clean, clean);
        return;
      } catch (err) { wiping = false; root.classList.remove('theme-wipe'); }
    }
    root.classList.add('theme-anim');
    apply(next, true);
    setTimeout(function () { root.classList.remove('theme-anim'); }, 350);
  });

  // 직접 고른 적이 없으면 기기 설정 변경을 따라간다
  if (window.matchMedia) {
    var mq = matchMedia('(prefers-color-scheme: light)');
    var onChange = function (ev) {
      var saved; try { saved = localStorage.getItem('theme'); } catch (e) {}
      if (!saved) apply(ev.matches ? 'light' : 'dark', false);
    };
    if (mq.addEventListener) mq.addEventListener('change', onChange); else if (mq.addListener) mq.addListener(onChange);
  }

  // 댓글 iframe은 늦게 생기므로, 생기면 현재 테마를 한 번 보낸다
  var box = document.getElementById('utterances-comments');
  if (box && window.MutationObserver) {
    new MutationObserver(function () {
      var frame = box.querySelector('.utterances-frame');
      if (frame && !frame.dataset.themed) {
        frame.dataset.themed = '1';
        frame.addEventListener('load', function () { setComments(current()); });
      }
    }).observe(box, { childList: true, subtree: true });
  }

  swapImages(current()); syncMeta(); syncButton(current());
})();
</script>
<script>
/* [my-blog] 홈 양쪽 패널 — 화면을 따라다니되 안쪽 스크롤은 없다.
   패널이 화면보다 크면 sticky 의 top 을 음수로 줘서, 페이지를 내리는 동안 패널의 아래쪽 끝까지 차례로 보이게 한다 */
(function () {
  var panels = [].slice.call(document.querySelectorAll('.home-page .sidebar.sticky, .home-page .home-aside'));
  if (!panels.length) return;
  var GAP = 24;
  var fit = function () {
    var offset = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fixed-offset')) || 0;
    panels.forEach(function (p) {
      var normal = offset + GAP;                                   // 평소 위치(상단바 아래)
      var bottomFit = window.innerHeight - p.offsetHeight - GAP;   // 패널 아래끝이 화면 아래끝에 닿는 위치
      p.style.setProperty('top', Math.min(normal, bottomFit) + 'px', 'important');
    });
  };
  fit();
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  if (window.ResizeObserver) {            // 방명록(giscus)이 늦게 커지거나 글이 쌓여 높이가 바뀌어도 다시 맞춘다
    var ro = new ResizeObserver(fit);
    panels.forEach(function (p) { ro.observe(p); });
  }
})();
</script>
<script>
/* [my-blog] 용어집 걸러 보기(/glossary/) · 홈 방명록(giscus) 불러오기와 테마 전환 */
(function () {
  // 태그 모아보기(/tags/): 주소의 #태그 하나의 글만 보여준다(없으면 가장 많이 쓴 태그). JS가 없으면 전부 보인다
  var tagView = document.querySelector('[data-tag-view]');
  if (tagView) {
    var tagGroups = [].slice.call(tagView.querySelectorAll('.group'));
    var tagLinks = [].slice.call(document.querySelectorAll('.tag-cloud a'));
    var tagMore = document.querySelector('.tag-more');
    var pickTag = function () {
      var id = ''; try { id = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
      var cur = tagGroups.filter(function (g) { return g.id === id; })[0] || tagGroups[0];
      if (!cur) return;
      tagGroups.forEach(function (g) { g.hidden = g !== cur; });
      tagLinks.forEach(function (a) {
        var on = a.getAttribute('href') === '#' + cur.id;
        a.classList.toggle('is-active', on);
        if (on) { a.setAttribute('aria-current', 'true'); if (tagMore && tagMore.contains(a)) tagMore.open = true; }
        else a.removeAttribute('aria-current');
      });
    };
    window.addEventListener('hashchange', pickTag);
    pickTag();
  }

  // 용어집: 입력한 글자가 들어 있는 용어만 남긴다. 비어 있는 모듈 묶음은 함께 숨긴다
  var input = document.querySelector('[data-gloss-find]');
  if (input) {
    var items = [].slice.call(document.querySelectorAll('[data-gloss-item]'));
    var groups = [].slice.call(document.querySelectorAll('[data-gloss-group]'));
    var status = document.querySelector('[data-gloss-status]');
    input.addEventListener('input', function () {
      var raw = input.value.trim(), q = raw.toLowerCase(), shown = 0;
      items.forEach(function (li) {
        var hit = !q || li.textContent.toLowerCase().indexOf(q) !== -1;
        li.hidden = !hit;
        if (hit) shown++;
      });
      groups.forEach(function (g) { g.hidden = !g.querySelector('[data-gloss-item]:not([hidden])'); });
      if (status) status.textContent = q ? ('"' + raw + '" ' + shown + '개') : '';
    });
  }

  // 방명록: 화면 폭에 따라 side(왼쪽 프로필 아래)와 inline(본문 아래) 중 하나만 보인다.
  // 보이는 쪽만, 화면에 가까워질 때 giscus 스크립트를 한 번 불러온다. 폭이 바뀌어 다른 쪽이 보이면 그때 불러온다.
  var books = [].slice.call(document.querySelectorAll('[data-guestbook]'));
  if (books.length) {
    var themeName = function () { return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; };
    var isShown = function (el) { return el.getClientRects().length > 0; };
    var loadBook = function (gb) {
      if (gb.dataset.loaded) return;
      gb.dataset.loaded = '1';
      var box = gb.querySelector('[data-guestbook-box]');
      var s = document.createElement('script');
      s.src = 'https://giscus.app/client.js';
      s.async = true;
      s.crossOrigin = 'anonymous';
      var attrs = {
        'data-repo': gb.getAttribute('data-repo'),
        'data-repo-id': gb.getAttribute('data-repo-id'),
        'data-category': gb.getAttribute('data-category'),
        'data-category-id': gb.getAttribute('data-category-id'),
        'data-mapping': 'specific',
        'data-term': gb.getAttribute('data-term'),
        'data-strict': '0',
        'data-reactions-enabled': '1',
        'data-emit-metadata': '0',
        'data-input-position': 'top',
        'data-theme': themeName(),
        'data-lang': 'ko',
        'data-loading': 'lazy'
      };
      Object.keys(attrs).forEach(function (k) { s.setAttribute(k, attrs[k]); });
      box.textContent = '';
      box.appendChild(s);
    };
    var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting && isShown(e.target)) { io.unobserve(e.target); loadBook(e.target); }
      });
    }, { rootMargin: '300px 0px' }) : null;
    var watchShown = function () {
      books.forEach(function (gb) {
        if (gb.dataset.loaded || !isShown(gb)) return;
        if (io) { io.unobserve(gb); io.observe(gb); } else { loadBook(gb); }
      });
    };
    watchShown();
    window.addEventListener('resize', watchShown);

    // 테마 전환: 떠 있는 giscus iframe 에 전달. iframe 이 늦게 생기면 생길 때 현재 테마를 한 번 보낸다
    var sendTheme = function (theme) {
      document.querySelectorAll('iframe.giscus-frame').forEach(function (frame) {
        if (frame.contentWindow) frame.contentWindow.postMessage({ giscus: { setConfig: { theme: theme } } }, 'https://giscus.app');
      });
    };
    books.forEach(function (gb) {
      var box = gb.querySelector('[data-guestbook-box]');
      if (!box || !window.MutationObserver) return;
      new MutationObserver(function () {
        var frame = box.querySelector('iframe.giscus-frame');
        if (frame && !frame.dataset.themed) {
          frame.dataset.themed = '1';
          frame.addEventListener('load', function () { sendTheme(themeName()); });
        }
      }).observe(box, { childList: true, subtree: true });
    });
    document.addEventListener('themechange', function (e) { sendTheme(e.detail.theme); });
  }
})();
</script>
