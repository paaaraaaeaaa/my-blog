<style>
:root {
  --fixed-offset: 110px; /* JS가 계산하기 전 기본값 */
}

/* 상단 메뉴바(배너) 고정 */
.masthead {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  right: 0 !important;
  width: 100% !important;
  z-index: 999 !important;
  background-color: #fff !important;
  box-shadow: 0 1px 6px rgba(0,0,0,.12);
}

/* 글 경로(breadcrumb)도 상단바 바로 밑에 고정 */
.breadcrumbs {
  position: fixed !important;
  left: 0 !important;
  right: 0 !important;
  width: 100% !important;
  z-index: 998 !important;
  background-color: #fff !important;
  border-bottom: 1px solid rgba(0,0,0,.08);
  padding-top: .5em;
  padding-bottom: .5em;
}

/* 왼쪽 프로필 사이드바 / 오른쪽 목차 sticky 시작 위치를,
   상단바+경로 높이만큼 아래로 밀어서 안 가리게 함 */
.sidebar.sticky,
.sidebar__right.sticky {
  top: calc(var(--fixed-offset) + 1em) !important;
  max-height: calc(100vh - var(--fixed-offset) - 2em) !important;
}

/* 게시글 본문 글씨 크기 살짝 축소 */
.page__content {
  font-size: 0.9em;
}

/* 코드 블록 복사 버튼 (항상 보이게) */
pre {
  position: relative !important;
}
.code-copy-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  z-index: 5;
  padding: 3px 10px;
  font-size: .72rem;
  line-height: 1.4;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 6px;
  background: rgba(0,0,0,.35);
  color: #fff;
  cursor: pointer;
  opacity: .85;
  transition: opacity .15s ease, background .15s ease;
}
.code-copy-btn:hover {
  opacity: 1;
  background: rgba(0,0,0,.55);
}

/* 목차(TOC) 스크롤바를 눈에 보이게 */
.sidebar__right.sticky::-webkit-scrollbar {
  width: 8px;
}
.sidebar__right.sticky::-webkit-scrollbar-thumb {
  background: rgba(0,0,0,.35);
  border-radius: 4px;
}
.sidebar__right.sticky::-webkit-scrollbar-track {
  background: rgba(0,0,0,.05);
}
</style>
