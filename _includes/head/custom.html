<style>
:root {
  --fixed-offset: 110px; /* JS가 계산하기 전 기본값 */
  /* 넓은 화면에서 배너/본문이 쓸 최대 폭. 테마 기본값은 1280px 이상 화면에서
     무조건 max-width:1280px로 고정돼서, 그보다 넓은 모니터에서는 배너와
     본문이 가운데 좁은 폭에 갇히고 양옆에 빈 여백만 남는다. 그래서 고정 px
     대신 화면 너비 비례값(vw)으로 바꿔서 창 크기에 따라 같이 늘어나게 함. */
  --site-max-width: min(94vw, 1920px);
}

/* 상단 메뉴바(배너) 고정 */
.masthead {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  right: 0 !important;
  width: 100% !important;
  z-index: 999 !important;
  background-color: #fff !important;
  box-shadow: 0 1px 6px rgba(0,0,0,.12);
}

/* 배너(제목/네비게이션) 안쪽 내용물을 감싸는 틀. 글자 크기·로고 크기는 그대로 두고
   이 틀의 최대 폭만 창 너비에 맞춰 늘어나도록 재설정 (테마 기본 1280px 고정 해제) */
.masthead__inner-wrap {
  max-width: var(--site-max-width) !important;
}

/* 글 경로(breadcrumb)도 상단바 바로 밑에 고정 */
.breadcrumbs {
  position: fixed !important;
  left: 0 !important;
  right: 0 !important;
  width: 100% !important;
  z-index: 998 !important;
  background-color: #fff !important;
  border-bottom: 1px solid rgba(0,0,0,.08);
  padding-top: .5em;
  padding-bottom: .5em;
  /* 테마 기본 max-width:1280px 고정 해제 (배너/본문과 폭을 맞춤) */
  max-width: var(--site-max-width) !important;
  margin-inline: auto !important;
}

/* 본문 영역(왼쪽 프로필 + 글 + 오른쪽 목차)도 배너와 같은 폭 기준을 쓰도록 함.
   배너만 넓어지고 본문은 좁은 채로 남으면 위아래 폭이 안 맞아 더 어색해 보임. */
#main {
  max-width: var(--site-max-width) !important;
}

/* 왼쪽 프로필 / 오른쪽 목차 sticky 시작 위치를 상단바+경로 높이만큼 밀어냄 */
.sidebar.sticky,
.sidebar__right.sticky {
  top: calc(var(--fixed-offset) + 1em) !important;
  max-height: calc(100vh - var(--fixed-offset) - 2em) !important;
}
/* 목차(오른쪽 사이드바): position:sticky와 overflow:auto를 같은 요소에 같이 주면
   sticky 위치 계산과 내부 스크롤이 서로 충돌해서 "끝까지 안 내려가고 본문을 스크롤해야
   보이는" 현상이 생김. 그래서 바깥(sticky 담당)과 안쪽(스크롤 담당)을 분리함. */
.sidebar__right.sticky {
  overflow: visible !important;
  display: flex;
  flex-direction: column;
}
.sidebar__right.sticky nav.toc {
  display: flex;
  flex-direction: column;
  min-height: 0;
  max-height: 100%;
}
.sidebar__right.sticky .toc__menu {
  overflow-y: auto;
  overflow-x: hidden;
  flex: 1 1 auto;
  min-height: 0;
  -webkit-overflow-scrolling: touch;
}

/* 경로(breadcrumb) 줄 오른쪽 끝에 조회수 뱃지를 붙이기 위한 배치 */
.breadcrumbs {
  display: flex !important;
  align-items: center;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: .5em;
}
.page-view-badge {
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
}
.page-view-badge img {
  height: 18px;
  display: block;
}

/* 게시글 본문 가독성: 글씨 살짝 축소 + 줄간격/여백 넉넉하게 */
.page__content {
  font-size: 0.9em;
  line-height: 1.85;
}
.page__content p,
.page__content li {
  margin-bottom: 0.65em;
}

/* 코드 블록 복사 버튼 (항상 보이게) */
pre {
  position: relative !important;
}
.code-copy-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  z-index: 5;
  padding: 3px 10px;
  font-size: .72rem;
  line-height: 1.4;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 6px;
  background: rgba(0,0,0,.35);
  color: #fff;
  cursor: pointer;
  opacity: .85;
  transition: opacity .15s ease, background .15s ease;
}
.code-copy-btn:hover {
  opacity: 1;
  background: rgba(0,0,0,.55);
}

/* 목차(TOC) 안쪽 목록(.toc__menu)에만 얇은 스크롤바를 둠 */
.sidebar__right.sticky .toc__menu {
  scrollbar-width: thin;             /* Firefox */
  scrollbar-color: rgba(0,0,0,.25) transparent;
}
.sidebar__right.sticky .toc__menu::-webkit-scrollbar {
  width: 4px;
  background: transparent;
}
.sidebar__right.sticky .toc__menu::-webkit-scrollbar-thumb {
  background: rgba(0,0,0,.25);
  border-radius: 4px;
}
.sidebar__right.sticky .toc__menu::-webkit-scrollbar-track {
  background: transparent;
}
/* 스크롤 여지가 더 있다는 걸 알려주는 아래쪽 흐림 효과 */
.sidebar__right.sticky .toc__menu::after {
  content: '';
  display: block;
  position: sticky;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 20px;
  margin-top: -20px;
  background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.95));
  pointer-events: none;
}

/* 색깔 콜아웃 박스 (💡 요약 / 🔴 에러 / 🟢 해결 / ⚠️🚨 주의) */
.callout {
  padding: .65em 1em;
  border-radius: 8px;
  margin: .8em 0;
}
.callout-summary {
  background: rgba(66,133,244,.08);
  border-left: 4px solid #4285f4;
}
.callout-error {
  background: rgba(234,67,53,.07);
  border-left: 4px solid #ea4335;
}
.callout-solution {
  background: rgba(52,168,83,.08);
  border-left: 4px solid #34a853;
}
.callout-warning {
  background: rgba(251,188,4,.12);
  border-left: 4px solid #f9ab00;
}

/* 목차(TOC)는 본문(page__content) 안에 같이 들어있는 구조라서,
   혹시라도 위 콜아웃 클래스가 목차 항목에 붙는 경우를 대비해
   목차 안에서는 색칠이 강제로 무효화되도록 이중 안전장치를 둠 */
.sidebar__right .callout,
.sidebar__right.callout,
nav.toc .callout,
nav.toc.callout,
.sidebar__right .concept-term {
  background: none !important;
  border-left: none !important;
  border-top: none !important;
  padding: inherit !important;
  margin: 0 !important;
}

/* 긴 코드 섹션 접기/펼치기 */
details.code-collapse {
  margin: 1em 0;
}
details.code-collapse > summary {
  cursor: pointer;
  padding: .5em .9em;
  background: rgba(0,0,0,.04);
  border-radius: 8px;
  font-size: .85em;
  color: #555;
  list-style: none;
  user-select: none;
}
details.code-collapse > summary::-webkit-details-marker {
  display: none;
}
details.code-collapse > summary::before {
  content: '▶ ';
}
details.code-collapse[open] > summary::before {
  content: '▼ ';
}
details.code-collapse[open] > summary {
  margin-bottom: .5em;
}

/* 개념/용어 정리형 목록: "- **용어**" 밑에 하위 설명이 달린 항목을 카드처럼 구분 */
.concept-term {
  margin-top: 1.3em;
  padding-top: .7em;
  border-top: 2px solid rgba(0,0,0,.07);
}
.concept-term:first-child {
  margin-top: 0;
  padding-top: 0;
  border-top: none;
}
.concept-term > strong:first-child {
  color: #1a73e8;
  font-size: 1.08em;
}
.concept-term ul {
  margin-top: .4em;
}

/* 홈 화면 방문자 박스 */
.visitor-box img {
  max-width: 100%;
}
.copy-link-btn {
  margin-top: 1em;
  width: 100%;
  padding: .6em;
  border-radius: 8px;
  border: 1px solid rgba(0,0,0,.15);
  background: #f7f7f7;
  cursor: pointer;
  font-size: .85em;
}
.copy-link-btn:hover {
  background: #eee;
}

/* 왼쪽 프로필의 이메일 복사 버튼: 다른 소셜 링크(GitHub 등)와 같은 줄 스타일로 맞춤 */
/* 주의: 테마 CSS에 ".author__urls-wrapper button { display: none; }" (데스크탑 화면에서
   모바일용 "Follow" 토글 버튼을 숨기는 규칙)가 있는데, 이 규칙이 우리 버튼도 같이 숨겨버림.
   그래서 선택자를 더 구체적으로 쓰고 !important로 확실히 이겨야 함. */
.author__urls-wrapper .author-email-btn {
  display: inline-flex !important;
  align-items: center;
  gap: .3em;
  background: none;
  border: none;
  padding: 0;
  margin: 0;
  font: inherit;
  color: inherit;
  cursor: pointer;
  text-decoration: none;
}
.author-email-btn:hover {
  text-decoration: underline;
}

/* Mermaid 다이어그램: 가운데 정렬 + 화면보다 넓으면 좌우 스크롤 */
.mermaid {
  display: flex;
  justify-content: center;
  margin: 1.2em 0;
  overflow-x: auto;
}
.mermaid svg {
  max-width: 100%;
}

/* ===== 이전 글 / 다음 글 네비게이션 꾸미기 ===== */
.pagination {
  display: grid !important;
  grid-template-columns: 1fr 1fr !important;
  gap: 1rem;
  margin: 2.2rem 0 !important;
  padding: 0 !important;
  list-style: none;
  clear: both;
}

.pagination::before,
.pagination::after {
  content: none !important;
  display: none !important;
}

.pagination--pager {
  display: flex !important;
  flex-direction: column;
  gap: 0.35em;
  padding: 1.1rem 1.3rem;
  border: 1px solid rgba(0,0,0,.08);
  border-radius: 14px;
  background: #fff;
  text-decoration: none !important;
  color: #333;
  font-weight: 700;
  font-size: 1rem;
  line-height: 1.4;
  position: relative;
  overflow: hidden;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 2px 8px rgba(0,0,0,.04);
  float: none !important;
  width: auto !important;
  max-width: none !important;
  box-sizing: border-box !important;
  margin: 0 !important;
}

.pagination--pager::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, #4285f4, #34a853);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.35s ease;
}

.pagination--pager:last-child::before {
  transform-origin: right;
}

.pagination--pager:hover::before {
  transform: scaleX(1);
}

.pagination--pager:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 24px rgba(66,133,244,.14);
  border-color: rgba(66,133,244,.25);
  color: #1a73e8;
}

.pagination--pager:first-child,
.pagination--pager:last-child {
  float: none !important;
  width: auto !important;
  text-align: left;
}

.pagination--pager:last-child {
  align-items: flex-end;
  text-align: right !important;
}

.pagination--pager.disabled {
  color: #bbb !important;
  background: rgba(0,0,0,.02);
  pointer-events: none;
  box-shadow: none;
}

.pagination--pager.disabled::before {
  display: none;
}

@media (max-width: 600px) {
  .pagination {
    grid-template-columns: 1fr;
  }
  .pagination--pager:last-child {
    align-items: flex-start;
    text-align: left !important;
  }
}

/* ===== 댓글 섹션 제목 꾸미기 ===== */
#comments-title,
.page__comments-title {
  position: relative;
  display: flex;
  align-items: center;
  gap: 0.5em;
  font-size: 1.05rem !important;
  font-weight: 800;
  letter-spacing: 0.02em;
  color: #333;
  margin: 2.2rem 0 1.1rem !important;
  padding-bottom: 0.7rem;
  border-bottom: 2px solid rgba(0,0,0,.06);
}

#comments-title::before,
.page__comments-title::before {
  content: '💬';
  font-size: 1.1rem;
}

#comments-title::after,
.page__comments-title::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -2px;
  width: 46px;
  height: 2px;
  background: linear-gradient(90deg, #4285f4, #34a853);
  border-radius: 999px;
}

.page__comments {
  margin-top: 1rem;
}

.page__comments iframe {
  border-radius: 12px !important;
}

/* ===== 오른쪽 목차(TOC) 꾸미기 =====
   주의: 홈 화면의 "한눈에 보기" 위젯도 nav.toc / .toc__menu 클래스를 재사용하므로,
   여기서는 실제 목차 링크 구조(li > a, 중첩 ul)에만 걸리는 선택자를 써서
   홈 화면 위젯 디자인은 건드리지 않도록 함. */
.sidebar__right.sticky nav.toc {
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 3px 14px rgba(0,0,0,.06);
  transition: box-shadow 0.3s ease;
}

.sidebar__right.sticky nav.toc:hover {
  box-shadow: 0 6px 20px rgba(0,0,0,.09);
}

.sidebar__right.sticky nav.toc header .nav__title {
  display: flex;
  align-items: center;
  gap: 0.4em;
  letter-spacing: 0.04em;
}

/* 목차 링크 목록 (게시글에서만 존재하는 li > a 구조) */
.toc__menu:not(.visitor-box) {
  padding: 0.4rem 0.3rem;
}

.toc__menu:not(.visitor-box) li {
  position: relative;
}

/* 최상위 레벨: 글의 큰 섹션 (예: "오늘의 상황") — 작은 라벨처럼 확실히 구분되게 */
.toc__menu:not(.visitor-box) > li > a {
  display: block;
  padding: 0.3rem 0.6rem;
  margin: 0.5rem 0 0.15rem;
  border-radius: 6px;
  font-size: 0.72rem;
  color: #1a73e8;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  line-height: 1.35;
  border-left: 2px solid transparent;
  transition: all 0.2s ease;
}

.toc__menu:not(.visitor-box) > li:first-child > a {
  margin-top: 0;
}

.toc__menu:not(.visitor-box) > li > a:hover {
  background: rgba(66,133,244,.08);
  border-left-color: #4285f4;
}

/* 2단계: 소제목 그룹 (예: "1단계 — 기준 정하기") — 진한 본문 글씨, 볼드는 빼서 1단계와 구분 */
.toc__menu:not(.visitor-box) > li > ul {
  margin: 0 0 0.15rem 0.35rem;
  padding-left: 0.6rem;
  border-left: 2px solid rgba(66,133,244,.15);
}

.toc__menu:not(.visitor-box) > li > ul > li {
  margin-top: 0.3rem;
}

.toc__menu:not(.visitor-box) > li > ul > li:first-child {
  margin-top: 0.05rem;
}

.toc__menu:not(.visitor-box) > li > ul > li > a {
  display: block;
  padding: 0.2rem 0.55rem;
  border-radius: 6px;
  font-size: 0.78rem;
  color: #333;
  font-weight: 600;
  line-height: 1.35;
  border-left: 2px solid transparent;
  transition: all 0.2s ease;
}

.toc__menu:not(.visitor-box) > li > ul > li > a:hover {
  color: #1a73e8;
  background: rgba(66,133,244,.07);
  border-left-color: #4285f4;
}

/* 3단계: 세부 항목 (예: "문제 상황", "시도한 방법") — 가장 작고 옅게, 안내선 없이 컴팩트하게 */
.toc__menu:not(.visitor-box) > li > ul > li > ul {
  margin: 0.1rem 0 0.05rem 0.25rem;
  padding-left: 0.45rem;
  border-left: 1px dashed rgba(0,0,0,.1);
}

.toc__menu:not(.visitor-box) > li > ul > li > ul > li {
  margin-top: 0;
}

.toc__menu:not(.visitor-box) > li > ul > li > ul > li > a {
  display: block;
  padding: 0.14rem 0.5rem;
  margin: 0;
  border-radius: 5px;
  font-size: 0.7rem;
  color: #999;
  font-weight: 400;
  line-height: 1.45;
  border-left: 2px solid transparent;
  transition: all 0.2s ease;
}

.toc__menu:not(.visitor-box) > li > ul > li > ul > li > a:hover {
  color: #1a73e8;
  background: rgba(66,133,244,.06);
  border-left-color: rgba(66,133,244,.5);
}

/* 스크롤 중 현재 보고 있는 섹션 강조 (테마/스크립트가 active 클래스를 붙이는 경우 대비) */
.toc__menu:not(.visitor-box) a.active,
.toc__menu:not(.visitor-box) a[aria-current="true"],
.toc__menu:not(.visitor-box) a.is-active-link {
  color: #1a73e8 !important;
  font-weight: 700;
  background: rgba(66,133,244,.1);
  border-left-color: #4285f4;
}
</style>
