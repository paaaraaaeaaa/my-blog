{% comment %}
  디자인 시스템 연결부. 스타일은 여기에 직접 쓰지 않는다.
  - 값(색·글꼴·간격): assets/css/tokens.css
  - 컴포넌트:         assets/css/site.css
  - 규칙 문서:        DESIGN.md
{% endcomment %}
<script>
  /* 테마: CSS보다 먼저 정해서 깜빡임 방지. 저장된 선택 > 기기 설정 > 다크 */
  (function () {
    var t;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<script>
  /* 부팅 화면: 세션에서 처음 여는 페이지에서만. CSS보다 먼저 클래스를 붙여 깜빡임을 막고, 2.2초가 지나면 무조건 걷는다 */
  (function () {
    try {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if (sessionStorage.getItem('booted')) return;
      sessionStorage.setItem('booted', '1');
    } catch (e) { return; }
    var d = document.documentElement, t0 = Date.now(), left = false;
    d.classList.add('is-booting');
    function leave() {
      if (left) return;
      left = true;
      d.classList.add('is-leaving');
      setTimeout(function () {
        d.classList.remove('is-booting', 'is-leaving');
        document.dispatchEvent(new Event('boot:done'));
      }, 300);
    }
    document.addEventListener('DOMContentLoaded', function () { setTimeout(leave, Math.max(0, 900 - (Date.now() - t0))); });
    setTimeout(leave, 2200);
  })();
</script>
