<style>
:root {
  --fixed-offset: 110px; /* JS가 계산하기 전 기본값 */
}

/* 상단 메뉴바(배너) 고정 */
.masthead {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  right: 0 !important;
  width: 100% !important;
  z-index: 999 !important;
  background-color: #fff !important;
  box-shadow: 0 1px 6px rgba(0,0,0,.12);
}

/* 글 경로(breadcrumb)도 상단바 바로 밑에 고정 */
.breadcrumbs {
  position: fixed !important;
  left: 0 !important;
  right: 0 !important;
  width: 100% !important;
  z-index: 998 !important;
  background-color: #fff !important;
  border-bottom: 1px solid rgba(0,0,0,.08);
  padding-top: .5em;
  padding-bottom: .5em;
}

/* 왼쪽 프로필 / 오른쪽 목차 sticky 시작 위치를 상단바+경로 높이만큼 밀어냄 */
.sidebar.sticky,
.sidebar__right.sticky {
  top: calc(var(--fixed-offset) + 1em) !important;
  max-height: calc(100vh - var(--fixed-offset) - 2em) !important;
}
/* 목차(오른쪽 사이드바): position:sticky와 overflow:auto를 같은 요소에 같이 주면
   sticky 위치 계산과 내부 스크롤이 서로 충돌해서 "끝까지 안 내려가고 본문을 스크롤해야
   보이는" 현상이 생김. 그래서 바깥(sticky 담당)과 안쪽(스크롤 담당)을 분리함. */
.sidebar__right.sticky {
  overflow: visible !important;
  display: flex;
  flex-direction: column;
}
.sidebar__right.sticky nav.toc {
  display: flex;
  flex-direction: column;
  min-height: 0;
  max-height: 100%;
}
.sidebar__right.sticky .toc__menu {
  overflow-y: auto;
  overflow-x: hidden;
  flex: 1 1 auto;
  min-height: 0;
  -webkit-overflow-scrolling: touch;
}

/* 경로(breadcrumb) 줄 오른쪽 끝에 조회수 뱃지를 붙이기 위한 배치 */
.breadcrumbs {
  display: flex !important;
  align-items: center;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: .5em;
}
.page-view-badge {
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
}
.page-view-badge img {
  height: 18px;
  display: block;
}

/* 게시글 본문 가독성: 글씨 살짝 축소 + 줄간격/여백 넉넉하게 */
.page__content {
  font-size: 0.9em;
  line-height: 1.85;
}
.page__content p,
.page__content li {
  margin-bottom: 0.65em;
}

/* 코드 블록 복사 버튼 (항상 보이게) */
pre {
  position: relative !important;
}
.code-copy-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  z-index: 5;
  padding: 3px 10px;
  font-size: .72rem;
  line-height: 1.4;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 6px;
  background: rgba(0,0,0,.35);
  color: #fff;
  cursor: pointer;
  opacity: .85;
  transition: opacity .15s ease, background .15s ease;
}
.code-copy-btn:hover {
  opacity: 1;
  background: rgba(0,0,0,.55);
}

/* 목차(TOC) 안쪽 목록(.toc__menu)에만 얇은 스크롤바를 둠 */
.sidebar__right.sticky .toc__menu {
  scrollbar-width: thin;             /* Firefox */
  scrollbar-color: rgba(0,0,0,.25) transparent;
}
.sidebar__right.sticky .toc__menu::-webkit-scrollbar {
  width: 4px;
  background: transparent;
}
.sidebar__right.sticky .toc__menu::-webkit-scrollbar-thumb {
  background: rgba(0,0,0,.25);
  border-radius: 4px;
}
.sidebar__right.sticky .toc__menu::-webkit-scrollbar-track {
  background: transparent;
}
/* 스크롤 여지가 더 있다는 걸 알려주는 아래쪽 흐림 효과 */
.sidebar__right.sticky .toc__menu::after {
  content: '';
  display: block;
  position: sticky;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 20px;
  margin-top: -20px;
  background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.95));
  pointer-events: none;
}

/* 색깔 콜아웃 박스 (💡 요약 / 🔴 에러 / 🟢 해결 / ⚠️🚨 주의) */
.callout {
  padding: .65em 1em;
  border-radius: 8px;
  margin: .8em 0;
}
.callout-summary {
  background: rgba(66,133,244,.08);
  border-left: 4px solid #4285f4;
}
.callout-error {
  background: rgba(234,67,53,.07);
  border-left: 4px solid #ea4335;
}
.callout-solution {
  background: rgba(52,168,83,.08);
  border-left: 4px solid #34a853;
}
.callout-warning {
  background: rgba(251,188,4,.12);
  border-left: 4px solid #f9ab00;
}

/* 목차(TOC)는 본문(page__content) 안에 같이 들어있는 구조라서,
   혹시라도 위 콜아웃 클래스가 목차 항목에 붙는 경우를 대비해
   목차 안에서는 색칠이 강제로 무효화되도록 이중 안전장치를 둠 */
.sidebar__right .callout,
.sidebar__right.callout,
nav.toc .callout,
nav.toc.callout,
.sidebar__right .concept-term {
  background: none !important;
  border-left: none !important;
  border-top: none !important;
  padding: inherit !important;
  margin: 0 !important;
}

/* 긴 코드 섹션 접기/펼치기 */
details.code-collapse {
  margin: 1em 0;
}
details.code-collapse > summary {
  cursor: pointer;
  padding: .5em .9em;
  background: rgba(0,0,0,.04);
  border-radius: 8px;
  font-size: .85em;
  color: #555;
  list-style: none;
  user-select: none;
}
details.code-collapse > summary::-webkit-details-marker {
  display: none;
}
details.code-collapse > summary::before {
  content: '▶ ';
}
details.code-collapse[open] > summary::before {
  content: '▼ ';
}
details.code-collapse[open] > summary {
  margin-bottom: .5em;
}

/* 개념/용어 정리형 목록: "- **용어**" 밑에 하위 설명이 달린 항목을 카드처럼 구분 */
.concept-term {
  margin-top: 1.3em;
  padding-top: .7em;
  border-top: 2px solid rgba(0,0,0,.07);
}
.concept-term:first-child {
  margin-top: 0;
  padding-top: 0;
  border-top: none;
}
.concept-term > strong:first-child {
  color: #1a73e8;
  font-size: 1.08em;
}
.concept-term ul {
  margin-top: .4em;
}

/* 홈 화면 방문자 박스 */
.visitor-box img {
  max-width: 100%;
}
.copy-link-btn {
  margin-top: 1em;
  width: 100%;
  padding: .6em;
  border-radius: 8px;
  border: 1px solid rgba(0,0,0,.15);
  background: #f7f7f7;
  cursor: pointer;
  font-size: .85em;
}
.copy-link-btn:hover {
  background: #eee;
}

/* 왼쪽 프로필의 이메일 복사 버튼: 다른 소셜 링크(GitHub 등)와 같은 줄 스타일로 맞춤 */
/* 주의: 테마 CSS에 ".author__urls-wrapper button { display: none; }" (데스크탑 화면에서
   모바일용 "Follow" 토글 버튼을 숨기는 규칙)가 있는데, 이 규칙이 우리 버튼도 같이 숨겨버림.
   그래서 선택자를 더 구체적으로 쓰고 !important로 확실히 이겨야 함. */
.author__urls-wrapper .author-email-btn {
  display: inline-flex !important;
  align-items: center;
  gap: .3em;
  background: none;
  border: none;
  padding: 0;
  margin: 0;
  font: inherit;
  color: inherit;
  cursor: pointer;
  text-decoration: none;
}
.author-email-btn:hover {
  text-decoration: underline;
}

/* Mermaid 다이어그램: 가운데 정렬 + 화면보다 넓으면 좌우 스크롤 */
.mermaid {
  display: flex;
  justify-content: center;
  margin: 1.2em 0;
  overflow-x: auto;
}
.mermaid svg {
  max-width: 100%;
}

/* ===== 이전 글 / 다음 글 네비게이션 꾸미기 ===== */
.pagination {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin: 2.2rem 0;
  padding: 0;
  list-style: none;
}

.pagination--pager {
  display: flex;
  flex-direction: column;
  gap: 0.35em;
  padding: 1.1rem 1.3rem;
  border: 1px solid rgba(0,0,0,.08);
  border-radius: 14px;
  background: #fff;
  text-decoration: none !important;
  color: #333;
  font-weight: 700;
  font-size: 1rem;
  line-height: 1.4;
  position: relative;
  overflow: hidden;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 2px 8px rgba(0,0,0,.04);
}

.pagination--pager::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, #4285f4, #34a853);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.35s ease;
}

.pagination--pager:nth-child(2)::before {
  transform-origin: right;
}

.pagination--pager:hover::before {
  transform: scaleX(1);
}

.pagination--pager:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 24px rgba(66,133,244,.14);
  border-color: rgba(66,133,244,.25);
  color: #1a73e8;
}

.pagination--pager:nth-child(2) {
  align-items: flex-end;
  text-align: right;
}

.pagination--pager.disabled {
  color: #bbb !important;
  background: rgba(0,0,0,.02);
  pointer-events: none;
  box-shadow: none;
}

.pagination--pager.disabled::before {
  display: none;
}

@media (max-width: 600px) {
  .pagination {
    grid-template-columns: 1fr;
  }
  .pagination--pager:nth-child(2) {
    align-items: flex-start;
    text-align: left;
  }
}

/* ===== 댓글 섹션 제목 꾸미기 ===== */
#comments-title,
.page__comments-title {
  position: relative;
  display: flex;
  align-items: center;
  gap: 0.5em;
  font-size: 1.05rem !important;
  font-weight: 800;
  letter-spacing: 0.02em;
  color: #333;
  margin: 2.2rem 0 1.1rem !important;
  padding-bottom: 0.7rem;
  border-bottom: 2px solid rgba(0,0,0,.06);
}

#comments-title::before,
.page__comments-title::before {
  content: '💬';
  font-size: 1.1rem;
}

#comments-title::after,
.page__comments-title::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -2px;
  width: 46px;
  height: 2px;
  background: linear-gradient(90deg, #4285f4, #34a853);
  border-radius: 999px;
}

.page__comments {
  margin-top: 1rem;
}

.page__comments iframe {
  border-radius: 12px !important;
}
</style>
