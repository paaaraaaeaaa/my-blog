<style>
:root {
  --fixed-offset: 110px; /* JS가 계산하기 전 기본값 */
}

/* 상단 메뉴바(배너) 고정 */
.masthead {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  right: 0 !important;
  width: 100% !important;
  z-index: 999 !important;
  background-color: #fff !important;
  box-shadow: 0 1px 6px rgba(0,0,0,.12);
}

/* 글 경로(breadcrumb)도 상단바 바로 밑에 고정 */
.breadcrumbs {
  position: fixed !important;
  left: 0 !important;
  right: 0 !important;
  width: 100% !important;
  z-index: 998 !important;
  background-color: #fff !important;
  border-bottom: 1px solid rgba(0,0,0,.08);
  padding-top: .5em;
  padding-bottom: .5em;
}

/* 왼쪽 프로필 / 오른쪽 목차 sticky 시작 위치를 상단바+경로 높이만큼 밀어냄 */
.sidebar.sticky,
.sidebar__right.sticky {
  top: calc(var(--fixed-offset) + 1em) !important;
  max-height: calc(100vh - var(--fixed-offset) - 2em) !important;
}
/* 목차(오른쪽 사이드바)만 내부 스크롤 가능하게 함 — 왼쪽 프로필은 손대지 않음 */
.sidebar__right.sticky {
  overflow-y: auto !important;
  overflow-x: hidden !important;
  -webkit-overflow-scrolling: touch;
}

/* 경로(breadcrumb) 줄 오른쪽 끝에 조회수 뱃지를 붙이기 위한 배치 */
.breadcrumbs {
  display: flex !important;
  align-items: center;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: .5em;
}
.page-view-badge {
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
}
.page-view-badge img {
  height: 18px;
  display: block;
}

/* 게시글 본문 가독성: 글씨 살짝 축소 + 줄간격/여백 넉넉하게 */
.page__content {
  font-size: 0.9em;
  line-height: 1.85;
}
.page__content p,
.page__content li {
  margin-bottom: 0.65em;
}

/* 코드 블록 복사 버튼 (항상 보이게) */
pre {
  position: relative !important;
}
.code-copy-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  z-index: 5;
  padding: 3px 10px;
  font-size: .72rem;
  line-height: 1.4;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 6px;
  background: rgba(0,0,0,.35);
  color: #fff;
  cursor: pointer;
  opacity: .85;
  transition: opacity .15s ease, background .15s ease;
}
.code-copy-btn:hover {
  opacity: 1;
  background: rgba(0,0,0,.55);
}

/* 목차(TOC) 스크롤바: 마우스를 올려도 항상 안 보이게 함.
   스크롤 기능(휠/트랙패드)은 그대로 살아있고, 스크롤바 막대만 안 보임 */
.sidebar__right.sticky {
  scrollbar-width: none;      /* Firefox */
  -ms-overflow-style: none;   /* 구형 Edge/IE */
}
.sidebar__right.sticky::-webkit-scrollbar {
  width: 0;
  background: transparent;
}

/* 색깔 콜아웃 박스 (💡 요약 / 🔴 에러 / 🟢 해결 / ⚠️🚨 주의) */
.callout {
  padding: .65em 1em;
  border-radius: 8px;
  margin: .8em 0;
}
.callout-summary {
  background: rgba(66,133,244,.08);
  border-left: 4px solid #4285f4;
}
.callout-error {
  background: rgba(234,67,53,.07);
  border-left: 4px solid #ea4335;
}
.callout-solution {
  background: rgba(52,168,83,.08);
  border-left: 4px solid #34a853;
}
.callout-warning {
  background: rgba(251,188,4,.12);
  border-left: 4px solid #f9ab00;
}

/* 목차(TOC)는 본문(page__content) 안에 같이 들어있는 구조라서,
   혹시라도 위 콜아웃 클래스가 목차 항목에 붙는 경우를 대비해
   목차 안에서는 색칠이 강제로 무효화되도록 이중 안전장치를 둠 */
.sidebar__right .callout,
.sidebar__right.callout,
nav.toc .callout,
nav.toc.callout,
.sidebar__right .concept-term {
  background: none !important;
  border-left: none !important;
  border-top: none !important;
  padding: inherit !important;
  margin: 0 !important;
}

/* 긴 코드 섹션 접기/펼치기 */
details.code-collapse {
  margin: 1em 0;
}
details.code-collapse > summary {
  cursor: pointer;
  padding: .5em .9em;
  background: rgba(0,0,0,.04);
  border-radius: 8px;
  font-size: .85em;
  color: #555;
  list-style: none;
  user-select: none;
}
details.code-collapse > summary::-webkit-details-marker {
  display: none;
}
details.code-collapse > summary::before {
  content: '▶ ';
}
details.code-collapse[open] > summary::before {
  content: '▼ ';
}
details.code-collapse[open] > summary {
  margin-bottom: .5em;
}

/* 개념/용어 정리형 목록: "- **용어**" 밑에 하위 설명이 달린 항목을 카드처럼 구분 */
.concept-term {
  margin-top: 1.3em;
  padding-top: .7em;
  border-top: 2px solid rgba(0,0,0,.07);
}
.concept-term:first-child {
  margin-top: 0;
  padding-top: 0;
  border-top: none;
}
.concept-term > strong:first-child {
  color: #1a73e8;
  font-size: 1.08em;
}
.concept-term ul {
  margin-top: .4em;
}

/* 홈 화면 방문자 박스 */
.visitor-box img {
  max-width: 100%;
}
.copy-link-btn {
  margin-top: 1em;
  width: 100%;
  padding: .6em;
  border-radius: 8px;
  border: 1px solid rgba(0,0,0,.15);
  background: #f7f7f7;
  cursor: pointer;
  font-size: .85em;
}
.copy-link-btn:hover {
  background: #eee;
}
</style>
