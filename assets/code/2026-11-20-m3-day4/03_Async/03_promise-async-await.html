<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>03. 콜백 지옥 → Promise → async/await</h1>
    <pre>
    주문할 때마다 1초 뒤에 포인트가 10P씩 적립된다. (적립 한도는 50P)
    버튼을 눌러 각 방식을 실행하고 콘솔을 확인하세요.
    </pre>
    <button id="btn-callback">1. 콜백 지옥</button>
    <script>
        // 해당 함수는 현재 포인트와 함수를 전달받아 누적 적립할 수 있는 함수
        function pointCallback(point, func) {
            setTimeout( () => {
                const result = point + 10;
                if(func) {
                    func(result);
                }
            }, 1000);
        }

        /* 
            point 함수 내부에 setTimneout 함수는 비동기 함수이다. 
            프로그램 요구사항의 경우 1초씩 누적해서 10P 를 더하기 위해서는 비동기 함수이더라도 호출의 순서가 중요하다.
            따라서 호출 순서를 지키기 위해 함수 내부에 함수를 누적해서 작성하는 것을 "콜백 지옥 (Callback Hell)" 이라고 부르며 이는 작성하면 안 되는 코드 중 하나의 예시이다.
        */
        function runCallback() {
            pointCallback(0, point => {
                console.log(`${point}P`);   // 10P
                pointCallback(point, point => {
                    console.log(`${point}P`);   // 20P
                    pointCallback(point, point => {
                        console.log(`${point}P`);   // 30P
                        pointCallback(point, point => {
                            console.log(`${point}P`);   // 40P
                            pointCallback(point, point => {
                                console.log(`${point}P`);   // 50P
                            })
                        }); 
                    });
                });
            });
        }


        const $callback = document.getElementById('btn-callback');
        $callback.addEventListener('click', runCallback);
    </script>

    <button id="btn-promise">2. Promise</button>

    <script>
        document.getElementById('btn-promise').addEventListener('click', runPromise);

        /*
            Promise 란?
            1. 비동기 처리 함수 실행 시 성공/실패에 대한 처리를 용이하게 resolve / reject 객체를 제공한다.
            - resolve : 함수의 인자로 넘어온 값을 저장하고 있다가 then() 함수를 만나면 저장한 값을 지는 promise 객체를 반환한다.
            - reject : 어떠한 이유로 거부되어야 할 때의 promise 객체를 반환한다.
        */

        function earnPoint(point) {

                const promise = new Promise((resolve, reject) => {
                    setTimeout( () => {
                        const result = point + 10;
                
                        if(result > 50) {
                            // 거부되어야 할 때 사용하는 reject 객체
                            return reject(new Error('적립 한도 초과'));
                        }

                        // 성공 시 resolve 객체를 반환
                        return resolve(result);  
                    }, 1000);
                });
            return promise;
        }
        

        function runPromise() {
            earnPoint(0)
            .then(point => {
                console.log(`${point}P`);   // 10P
                return earnPoint(point);
            })
            .then(point => {
                console.log(`${point}P`);   // 20P
                return earnPoint(point);
            })
            .then(point => {
                console.log(`${point}P`);   // 30P
                return earnPoint(point);
            })
            .then(point => {
                console.log(`${point}P`);   // 40P
                return earnPoint(point);
            })
            .then(point => {
                console.log(`${point}P`);   // 50P
            })
            .catch(e => {console.error(e, '발생~!!!!!!!!')})
            .finally(() => {console.log('포인트 적립 종료')})
        };
    
    </script>

    <button id="btn-async">3. async/await</button>

    <script>
        document.getElementById('btn-async').addEventListener('click', runAsync);

        /*
            async / await 
            await 란? await 가 달린 함수의 결과인 promise 에 담긴 결과를 반환하게 된다. == then() 을 대신하는 방법
        */

        // async 키워드는 awiat 를 사용하기 위해서 await 를 사용하는 함수 앞에 붙이게 된다.

        // promise 객체는 비동기 (ex: timeout, interval, api 호출) 결과값을 가지고 있는 객체이다.

        // .then() -> resolve 객체 사용 가능
        // await -> resolve 객체 사용 가능

        // .then() 절의 경우는 메서드 체이닝 방식으로 .catch() 를 사용해서 예외처리가 가능하다.
        // async / await 의 경우는 메서드 체이닝 방식이 아니기 때문에 예외처리를 위해서는 try - catch 구문으로 감싸야 한다.
        async function runAsync() {

            /*
                promise, async, await 는 비동기처리 단점인 어느 시점에 실행될 지 모르는 단점을 해결하기 위한 문법이다.
                비동기 처리를 동기 방식으로 동작하게 만드는 아주 중요한 문법이다.
            */

            try {
                let point = await earnPoint(0);
                console.log(`${point}P`);   // 10P
                point = await earnPoint(point);
                console.log(`${point}P`);   // 20P 
                point = await earnPoint(point);
                console.log(`${point}P`);   // 30P
                point = await earnPoint(point);
                console.log(`${point}P`);   // 40P
                point = await earnPoint(point);
                console.log(`${point}P`);   // 50P
                point = await earnPoint(point);
                console.log(`${point}P`);   // 60P => 예외 발생!
            } catch(e) {
                console.log(e, '발생~!!!!!!!!');
            } finally {
                console.log('포인트 적립 종료');
            }

            // await 키워드는 promise 객체의 resolve 를 사용할 수 있게 만든다.
           

        }
    </script>

</body>
</html>
