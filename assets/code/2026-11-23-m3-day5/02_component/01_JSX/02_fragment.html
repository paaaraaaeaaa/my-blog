<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <!--
        JSX (javaScript XML) 자바스크립트 문법을 XML 방식으로 작성할 수 있게 지원하는 문법
        <><> babel 은 jsx 를 js 로 변환해주는 트랜스파일링 툴이라고 보면 된다.
    -->
    <script crossorigin src="https://unpkg.com/@babel/standalone@8.1.3/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">

        /*
            JSX 문법 사용 시 주의해야 할 규칙
            1. 동일 레벨의 요소 노드들이 연달아 정의되면 문법 에러 발생
        */

        const user = {
            name : '예린',
            phone : '010-1234-5678'
        }

        // 1. 최상위 엘리먼트가 2개 이상 (== 같은 레벨) 이면 문법 에러
        // const element = (
        //     <h1>{user.name}</h1>
        //     <h3>{user.phone}</h3>
        // );


        // 2. 최상위 엘리먼트 내부에 넣어서 하나의 돔 트리를 생성
        // const element = (
        //     <div>
        //         <h1>{user.name}</h1>
        //         <h3>{user.phone}</h3>
        //     </div>
        // );


        // 3. <></> (React.Fragment)
        // 2번의 경우 div 를 최상위 요소로 하게 되면 불필요하게 div 라는 영역이 생기게 된다.
        const element = (
            <>
                <h1>{user.name}</h1>
                <h3>{user.phone}</h3>
            </>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(element);
    </script>
</body>
</html>
