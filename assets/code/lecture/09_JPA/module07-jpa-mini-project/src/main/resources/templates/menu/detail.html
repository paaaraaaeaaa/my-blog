<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>메뉴 상세 조회</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
        }

        .container {
            max-width: 700px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #37474f;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 12px;
        }

        th {
            background: #546e7a;
            color: white;
            padding: 15px;
            font-size: 15px;
        }

        td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: #f1f1f1;
        }

        .status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .available {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .unavailable {
            background: #ffcdd2;
            color: #c62828;
        }

        .back-btn {
            margin-top: 30px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #ff7043;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #d84315;
        }

        .status-forms {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .status-forms form {
            flex: 1;
        }

        .status-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #78909c;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .status-btn:hover {
            background: #455a64;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🍽 메뉴 상세 조회</h1>

    <table>
        <tr>
            <th>메뉴번호</th>
            <th>메뉴이름</th>
            <th>가격</th>
            <th>카테고리</th>
            <th>판매상태</th>
        </tr>
        <tr>
            <td th:text="${result.menuCode}"></td>
            <td th:text="${result.menuName}"></td>
            <td th:text="${result.menuPrice} + '원'"></td>
            <td th:text="${result.categoryCode}"></td>

            <!-- 상태 스타일 적용 -->
            <td>
                <span th:classappend="${result.orderableStatus} == 'Y' ? 'status available' : 'status unavailable'"
                      th:text="${result.orderableStatus} == 'Y' ? '판매중' : '판매중지'">
                </span>
            </td>
        </tr>
    </table>

    <!-- 두 버튼을 항상 보여준다. 이미 판매중지된 메뉴를 또 판매중지하는 요청은 화면이 아니라 Menu(Entity) 가 막는다. -->
    <div class="status-forms">
        <form action="/menu/stop" method="post">
            <input type="hidden" name="menuCode" th:value="${result.menuCode}">
            <button class="status-btn" type="submit">⏸ 판매중지</button>
        </form>
        <form action="/menu/resume" method="post">
            <input type="hidden" name="menuCode" th:value="${result.menuCode}">
            <button class="status-btn" type="submit">▶ 판매재개</button>
        </form>
    </div>

    <button class="back-btn" onclick="location.href='/menu/list'">📋 전체 메뉴 목록</button>
</div>

</body>
</html>
