<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>메뉴 조회 결과</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fdfbfb, #ebedee);
        }

        .container {
            max-width: 900px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        h3 {
            text-align: center;
            color: #37474f;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
        }

        th {
            background: #5c6bc0;
            color: white;
            padding: 15px;
            font-size: 14px;
        }

        td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f5f5f5;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* 상태 뱃지 */
        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .available {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .unavailable {
            background: #ffcdd2;
            color: #c62828;
        }

        /* 가격 강조 */
        .price {
            font-weight: bold;
            color: #ff7043;
        }

        /* 버튼 */
        .btn-group {
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #7e57c2;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #5e35b1;
        }
    </style>
</head>

<body>

<div class="container">
    <h3 th:text="|💰 ${price}원 초과 메뉴 목록|"></h3>

    <table>
        <tr>
            <th>메뉴번호</th>
            <th>메뉴이름</th>
            <th>가격</th>
            <th>카테고리</th>
            <th>판매상태</th>
        </tr>

        <tr th:each="result : ${menuList}">
            <td th:text="${result.menuCode}"></td>
            <td th:text="${result.menuName}"></td>

            <!-- 가격 강조 -->
            <td class="price" th:text="${result.menuPrice} + '원'"></td>

            <td th:text="${result.categoryCode}"></td>

            <!-- 상태 스타일 -->
            <td>
                <span th:classappend="${result.orderableStatus} == 'Y' ? 'status available' : 'status unavailable'"
                      th:text="${result.orderableStatus} == 'Y' ? '판매중' : '판매중지'">
                </span>
            </td>
        </tr>
    </table>

    <!-- 버튼 영역 -->
    <div class="btn-group">
        <button class="btn" onclick="history.back()">⬅ 뒤로가기</button>
        <button class="btn" onclick="location.href='/'">🏠 홈으로</button>
    </div>
</div>

</body>
</html>
