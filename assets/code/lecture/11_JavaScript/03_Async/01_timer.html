<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>01. 타이머</h1>
    <pre>
        setTimeout 함수와 setInterval 함수
        두 함수는 코드의 진행 중 간극을 만들어내는 함수이다.
        setTimeout ( 실행시킬 함수, 지연 시간 [, parameter] )
    </pre>

    <script>
        // 피자를 조리하는데 걸리는 시간 (5초)
        setTimeout(() => console.log("5초 경과! 피자 조리 완료~~🍕"), 5000);

        // 프로그래밍의 개념으로는 5초 경과 메세지 후에 아래 주문 메세지가 나와야 한다. (위->아래 개념)
        console.log("주문 하실 사람~~!");

        // 비동기 작업은 코드가 끝나기만을 기다리며 대기하는 것이 아닌 
        // 별도의 작업 공간에서 오래 걸리는 작업을 별도로 수행하고 메인 코드의 흐름을 이어나가는 것이다.
        setTimeout((menuName) => console.log(`3초 경과! ${menuName} 조리 완료~~🍗`), 3000, "치킨");

        // --------------------------------------------------------------------
        // interval 간격을 두고 반복 수행 시 사용함.
        let count = 1;

        const interval = setInterval(() => {
            console.log(`배달 도착까지 ${5 - count}초`);
            count++;

            // 1초 간의 간격으로 반복 실행하기 때문에 종료의 조건을 달아주는 것이 중요하다.
            if(count == 5) {
                // interval 함수의 변수명을 전달
                // 해당 함수는 interval 함수를 제거하는 역할을 한다.
                clearInterval(interval);
                console.log("배달 완료!🛒");
            }
        }, 1000);

    </script>
</body>
</html>
