<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <!--
        JSX (javaScript XML) 자바스크립트 문법을 XML 방식으로 작성할 수 있게 지원하는 문법
        <><> babel 은 jsx 를 js 로 변환해주는 트랜스파일링 툴이라고 보면 된다.
    -->
    <script crossorigin src="https://unpkg.com/@babel/standalone@8.1.3/babel.min.js"></script>
</head>
<body>
    
    <!--
        가상 DOM 이 표현될 root 엘리먼트
    -->
    <div id="root"></div>

    <!--
        jsx 사용하는 방법
        1. 바벨 관련 script 를 head 영역에 추가
        2. script 태그에 type 속성에 text/babel 값 추가
    -->
    <script type="text/babel">

        function formatName(user) {
            return `${user.lastName} ${user.firstName}`;
        }

        const user = {
            firstName : "예린", 
            lastName : "김"
        };

        // jsx 내에서 중괄호를 활용하여 모든 js 표현식을 사용할 수 있다.
        const element = <h1 class="test">안녕!! {formatName(user)}</h1>
        // const element = React.createElement('h1', {class : "test"}, "안녕!!")

        ReactDOM.createRoot(document.getElementById('root')).render(element);

    </script>

</body>
</html>
