spring:
  application:
    name: chap07-thymeleaf

# Thymeleaf 기본 설정 (아래 값은 Spring Boot 기본값이므로 작성하지 않아도 동일하게 동작한다.)
# 컨트롤러가 반환한 뷰 이름 앞뒤에 prefix/suffix를 붙여 템플릿 파일을 찾는다.
#   "lecture/expression" -> classpath:/templates/lecture/expression.html
#spring.thymeleaf.prefix=classpath:/templates/
#spring.thymeleaf.suffix=.html

# 메시지 표현식 #{...}이 읽어올 파일 이름 (기본값: messages -> resources/messages.properties)
#spring.messages.basename=messages