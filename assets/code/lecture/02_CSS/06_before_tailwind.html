<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>상품 카드 — 움직임</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>오늘의 추천 상품</h1>

  <main class="card-list">

    <!-- 첫 카드에만 NEW 배지가 붙고, 그 배지가 깜빡인다 -->
    <div class="card">
      <div class="thumb"></div>
      <span class="badge">NEW</span>
      <h2 class="product-name">무선 이어폰</h2>
      <p class="price">89,000원</p>
    </div>

    <div class="card">
      <div class="thumb"></div>
      <h2 class="product-name">블루투스 스피커</h2>
      <p class="price">129,000원</p>
    </div>

    <div class="card">
      <div class="thumb"></div>
      <h2 class="product-name">노트북 거치대</h2>
      <p class="price">34,000원</p>
    </div>

  </main>

</body>
</html>
