<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02_event-object</title>
    <style>
        .map {
            width: 200px;
            height: 200px;
            background: lightgray;
        }
    </style>
</head>
<body>
    <h1>02. 이벤트 객체와 this</h1>

    <h2>1) 이벤트 객체</h2>
    <h3 class="message">📍 배달 받을 위치를 아무 곳이나 클릭해 보세요!</h3>
    <div class="map" onmouseover="showMapCoords(event)">
        지도 영역 내부를 클릭해 보세요!
    </div>

    <h2>2) 이벤트 핸들러 내부의 this</h2>
    <h3>이벤트 핸들러 어트리뷰트</h3>
    <button onclick="handleClick1()">떡볶이</button>
    <button onclick="handleClick2(this)">순대</button>

    <h3>이벤트 핸들러 프로퍼티, addEventListener</h3>
    <button id="btn1">김밥</button>
    <button id="btn2">라면</button>

    <h3>화살표 함수</h3>
    <button id="btn3">튀김</button>
    <button id="btn4">어묵</button>

    <script>
        const $msg = document.querySelector('.message');

        /*
            이벤트를 등록하게 되면 내부적으로 이벤트 객체가 생기게 된다.
            이벤트 객체는 매개변수로 전달 받을 수 있으며,
            해당 값을 참조하거나 변경하거나 제거할 수 있게 된다.
        */
        function showCoords(e) {
            console.log(e);
            $msg.textContent = `배달 위치 : ${e.clientX} , ${e.clientY}`;
            // e.pointerType = 'pen';
        }

        // html 전역에 onClick 이벤트 등록
        document.onclick = showCoords;

        // div 추출
        const $map = document.querySelector('.map');
        
        function showMapCoords(e) {
            console.log(e);
            $map.textContent = `지도 : ${e.clientX} , ${e.clientY}`;
            e.pointerType = 'pen';
        }

        // 2) 이벤트 핸들러 내부의 this
        function handleClick1() {
            // 일반 함수 내부에서 this 를 출력하게 되면
            // 전역 객체인 window 객체를 반환한다.
            console.log('click1' , this);
        }

        function handleClick2(btn) {
            // 함수 호출 시 this 를 전달해주게 되면
            // 이벤트를 가지고 있는 DOM 요소를 반환한다.
            console.log('click2' , btn);
            /*
                이벤트 함수에서 this 는 이벤트 대상 DOM 요소의
                정보를 가지게 된다.
                따라서 이벤트 발생 시 해당 DOM 을 없애거나
                추가적인 동작을 더 추가하고자 하면 this 를
                활용해서 작업을 할 수 있게 된다.
            */
        }

    </script>

</body>
</html>
