<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            color: red;
        }

        div {
            background: blue;
            color: aqua;
        }

        #test1 {
            background: palegoldenrod;
        }

        .test1 {
            background: darkblue;
        }

        #test2 {
            background: dodgerblue;
        }

        .test2 {
            background: tomato !important;
        }
    </style>
</head>
<body>
    <h1>선택자 우선순위</h1>
    <pre>
        CSS는 기본적으로 위에서 아래로 적용이 된다.
        같은 태그 요소에 여러 개의 CSS 속성이 설정된 경우에는 우선
        우선순위에 따라 스타일이 적용되게 한다.
    </pre>
    <hr>
    <h3>선택자 우선순위 계급</h3>
    <pre>
        <strong>
            !important > 인라인 선택자 > 아이디 선택자
            > 클래스 선택자 > 태그 선택자 > 전체 선택자
        </strong>
    </pre>
    <hr>
    <h3>선택자 우선순위 테스트</h3>
    <!-- div#test1.test1{우선순위테스트} -->
    <div id="test1" class="test1">우선순위테스트</div>
    <hr>
    <!--
    태그 내부에 css를 속성으로 정의하는 것을 인라인 방식이라고 한다.
    -->
    <div id="test2" class="test2" style="background: green;">우선순위테스트</div>

    
</body>
</html>
