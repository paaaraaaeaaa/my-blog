<script>
document.addEventListener('DOMContentLoaded', function () {
  // 1. 코드 복사 버튼
  document.querySelectorAll('pre').forEach(function (pre) {
    if (pre.parentElement && pre.parentElement.querySelector(':scope > .code-copy-btn')) return;

    var codeEl = pre.querySelector('code') || pre;

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'code-copy-btn';
    btn.textContent = '복사';
    btn.addEventListener('click', function () {
      var text = codeEl.innerText;
      var done = function (ok) {
        btn.textContent = ok ? '복사됨!' : '실패';
        setTimeout(function () { btn.textContent = '복사'; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done(true); }).catch(function () { done(false); });
      } else {
        var ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(true); } catch (e) { done(false); }
        document.body.removeChild(ta);
      }
    });

    pre.style.position = 'relative';
    pre.appendChild(btn);
  });

  // 2. 상단바를 fixed로 바꾼 만큼, 본문이 가려지지 않도록 여백 자동 보정
  function adjustMastheadOffset() {
    var masthead = document.querySelector('.masthead');
    if (masthead) {
      document.body.style.paddingTop = masthead.offsetHeight + 'px';
    }
  }
  adjustMastheadOffset();
  window.addEventListener('resize', adjustMastheadOffset);
});
</script>
