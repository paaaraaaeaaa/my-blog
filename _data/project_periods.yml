# _data/project_periods.yml
# Cloud 학습 달력에서 팀 프로젝트 기간을 표시합니다.
# 해당 module의 달력에서, 글이 없는 평일 칸이 start~end 사이이면 "프로젝트" 칸으로 보입니다.
# 휴일(holidays.yml)은 그대로 "휴일"로 남습니다. 글이 있는 날은 글 칸이 우선합니다.
# 주의: 날짜는 반드시 따옴표로 감싼다 (따옴표가 없으면 날짜 값으로 읽혀 비교가 깨진다).
# 한계: 달력의 주(week)는 학습노트가 한 편이라도 있는 주만 만들어진다. 글이 없는 주는 기간이어도 칸이 나오지 않는다.
# 형식: - { module: 모듈번호, start: "YYYY-MM-DD", end: "YYYY-MM-DD", label: "프로젝트 이름" }
- { module: 2, start: "2026-11-06", end: "2026-11-12", label: "MoneyBeetle 팀 프로젝트" }
